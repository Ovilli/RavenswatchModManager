[mod]
id          = "SeedRunsChapter3"
name        = "Seed Runs: Chapter 3 Start"
version     = "0.1.1"
author      = "Ovilli"
description = "Seeded-run race mod: every install plays the identical run starting at chapter 3. Re-sequences the run's chapter list (game_mode kind, overrides All_Chapters) and pins the world-generation seed via the game's own Forced-seed option (R.options + Dev flag). Configure the seed per-event in the mod config; share the mod instead of a savefile."
enabled     = false
sdk_version = ">=3.0,<4"
# game_mode is an 'experimental' kind: the chapter vector is
# deserializer-verified, but the engine honouring a re-sequenced order in a
# live run is playtest-pending. See docs/_re/kinds/maps-chapters.md.
experimental = true

tags        = ["seeded-runs", "challenge", "game-mode"]
# Override the retail All_Chapters gamemode def in place (same id = same
# cooked path), so the standard run uses the new sequence without needing a
# new mode to show up in any menu. chapters are sub-object indices into the
# vanilla sequence [0, 1, 2, 3]; [2, 3] starts the run at the third chapter
# and keeps the remainder of the vanilla order. Restore via disable + apply.
[[content]]
kind     = "game_mode"
id       = "All_Chapters"
base     = "All_Chapters"
chapters = [2, 3]
