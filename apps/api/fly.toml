app = "rsmm-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  WEB_URL = "https://www.rsmm.me"
  # CORS allow-list. Tauri origins are appended automatically in env.ts.
  TRUSTED_ORIGINS = "https://www.rsmm.me,https://rsmm.me"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
