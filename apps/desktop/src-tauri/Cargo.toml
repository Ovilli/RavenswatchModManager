[package]
name = "rsmm-desktop"
version = "0.4.11"
description = "Ravenswatch Mod Manager desktop shell"
authors = ["Ovilli"]
edition = "2021"

[lib]
name = "rsmm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
# JS dep `@daveyplate/better-auth-tauri` calls `platform()` from
# `@tauri-apps/plugin-os` during sign-in; without the Rust plugin registered
# the `__TAURI_OS_PLUGIN_INTERNALS__` global is undefined and login throws.
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Required for `rsmm://` OAuth deep links to route into the already-running
# app instead of spawning a second window on Linux/Windows.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
