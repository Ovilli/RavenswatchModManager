# Editor schema for mod manifests in this checkout (Taplo / Even Better TOML).
# Scaffolded mods carry a `#:schema` line of their own; this covers the rest.
# Generated by `rsmm docs-gen` from src/rsmm/sdk/manifest_spec.py.
[[rule]]
include = ["mods/*/manifest.toml"]

[rule.schema]
path = "./apps/docs/public/manifest.schema.json"
