# Publish the loader DLL + Lua SDK to the rolling `loader` release.
#
# This is the channel `rsmm update-loader` polls, so a loader or Lua-SDK fix
# reaches users without a desktop release + reinstall. Manual dispatch only:
# it is a deliberate publish, never a side effect of a push.
#
# Runs here rather than on a laptop because the signing key is already a repo
# secret. The client refuses an unsigned manifest, and the same key signs the
# desktop bundles, so publishing from CI keeps that key in exactly one place.
name: Publish loader channel

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'What changed in this loader/SDK build (shown by `rsmm update-loader`)'
        required: true
        type: string
      dry_run:
        description: 'Build, sign and verify, but do not upload or bump the version'
        required: false
        default: false
        type: boolean
      changelog:
        description: 'Announce this publish in the release-notes feed (users see it without an app release)'
        required: false
        default: true
        type: boolean
      highlights:
        description: 'Release-note bullets, ONE PER LINE (default: the notes above, as a single bullet)'
        required: false
        type: string

# Two publishes at once would each bump the stamp from the same starting value
# and fight over the same release assets. Queue them instead.
concurrency:
  group: publish-loader
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    permissions:
      contents: write     # create/upload the release AND push the version bump

    steps:
      - uses: actions/checkout@v4
        with:
          # Need a real branch (not a detached HEAD) to push the version bump.
          ref: main
          # And real history: the bump is rebased onto whatever landed on main
          # while the DLL was building, which a depth-1 clone cannot do.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # MinGW cross-compiler for the DLL; lua5.4 so the SDK compile gate in
      # the publish script actually runs instead of warning that it cannot.
      - name: Build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 lua5.4

      # `pnpm --filter desktop exec tauri signer sign` needs the workspace's
      # devDependencies installed.
      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build loader DLL (MinGW cross)
        run: src/loader/build.sh

      # Same gate the release workflow applies: a malformed or exportless DLL
      # must never reach the channel, which plants straight into the game.
      - name: Validate loader DLL
        run: python scripts/validate_loader_dll.py dist/winhttp.dll

      # The publish script's own Lua check is `luac` — SYNTAX only, which a
      # semantically broken SDK passes. 5.4.4 shipped with 343 lines missing
      # from rsmm.lua and every capability they backed gone; luac was happy,
      # the spec was not, and nothing here looked at the spec. Two minutes of
      # tests is cheap against a bundle that gets injected into the game
      # process on every user's machine.
      - name: Test the SDK and the CLI
        run: |
          lua5.4 tests/lua/rsmm_spec.lua src/loader/lib
          pip install -e ".[dev]"
          python -m pytest -n auto -m "not slow"

      # `notes` reaches the shell through the ENVIRONMENT, never through
      # `${{ inputs.notes }}` interpolation. Interpolating it pastes the raw
      # text into the script body, where bash reads it as code: a note
      # containing backticks runs as command substitution (that is exactly how
      # the v9 publish died — "`rsmm doctor`" became "rsmm: command not found",
      # exit 127 — and it swallowed the words either side of it in the
      # published manifest). A dispatcher who can write the note could
      # otherwise run arbitrary commands on a runner holding the signing key.
      - name: Publish (sign + upload)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          [ "$DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          ARGS+=(--notes "$NOTES")
          scripts/publish_loader.sh "${ARGS[@]}"

      # The publish script bumps data/loader_version.json. That stamp is what
      # stops `restore --all` + `install-loader` from downgrading users, so an
      # uncommitted bump breaks the guard in both directions — commit it here
      # rather than relying on a human to remember.
      # A loader publish reaches every user with no app release — which is the
      # whole point of the channel, and used to mean it landed silently. The
      # note is a CHANNEL entry (keyed by loader_version, not by an app
      # version), so the desktop shows it against the loader they have planted.
      - name: Announce it in the release-notes feed
        if: ${{ !inputs.dry_run && inputs.changelog }}
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          HIGHLIGHTS: ${{ inputs.highlights }}
        run: |
          VERSION=$(python -c "import json;print(json.load(open('data/loader_version.json'))['loader_version'])")
          ARGS=(--loader-version "$VERSION" --summary "$NOTES")
          if [ -n "$HIGHLIGHTS" ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && ARGS+=(--highlight "$line")
            done <<< "$HIGHLIGHTS"
          else
            ARGS+=(--highlight "$NOTES")
          fi
          python scripts/add_loader_changelog.py "${ARGS[@]}"
          scripts/publish_changelog.sh

      # The push RACES every other commit to main: this job builds the DLL for
      # ~15 minutes, and anything merged in that window makes a bare
      # `git push origin HEAD:main` a non-fast-forward. That is what happened on
      # the v12 publish — the channel went live, the stamp did not, and the repo
      # then claimed v11 while users were being served v12, which is precisely
      # the state `_replant_newer_loader` cannot correct. So rebase and retry;
      # the bump touches two files nothing else writes, so there is nothing for
      # a rebase to conflict with.
      - name: Commit the loader version bump
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet -- data/loader_version.json data/changelog.json; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION=$(python -c "import json;print(json.load(open('data/loader_version.json'))['loader_version'])")
          git add data/loader_version.json data/changelog.json
          git commit -m "chore(loader): publish loader channel v${VERSION}"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git pull --rebase origin main || { git rebase --abort || true; }
            sleep $((attempt * 5))
          done
          echo "::error::could not push the v${VERSION} stamp after 5 attempts."
          echo "The channel IS published — repair the repo by setting"
          echo "data/loader_version.json to ${VERSION} and committing"
          echo "data/changelog.json as published, or main will keep claiming an"
          echo "older loader than users are served."
          exit 1
