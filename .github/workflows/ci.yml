name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run everything, whatever changed.
  workflow_dispatch:

# Read-only token: nothing here writes to the repo, so a compromised step
# or action cannot push, tag or edit releases with it.
permissions:
  contents: read

jobs:
  # Which jobs this change needs. A job whose inputs did not change is skipped
  # (a skipped job counts as passed), so a website-only change does not wait on
  # two PyInstaller builds and a Python-only one does not rebuild the loader.
  # Each filter errs toward running: when in doubt a path is listed.
  changes:
    name: changes (which jobs to run)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.python }}
      sidecar: ${{ github.event_name == 'workflow_dispatch' || steps.inputs.outputs.sidecar }}
      ts: ${{ github.event_name == 'workflow_dispatch' || steps.inputs.outputs.ts }}
      loader: ${{ github.event_name == 'workflow_dispatch' || steps.inputs.outputs.loader }}
      docs_links: ${{ github.event_name == 'workflow_dispatch' || steps.inputs.outputs.docs_links }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          # `python` lists what it may SKIP for ("every" pattern must match):
          # the tests read far outside src/ (the desktop app's tauri.conf.json
          # and package.json, docs/, README, .github, tools/, examples/), so
          # only changes confined to the web apps and shared TS packages skip.
          predicate-quantifier: every
          filters: |
            python:
              - '**'
              - '!apps/www/**'
              - '!apps/api/**'
              - '!apps/desktop/src/**'
              - '!packages/**'
              - '!pnpm-lock.yaml'
              - '!biome.json'
              - '!turbo.json'
          # The other filters list their inputs ("some" is enough).
      - id: inputs
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            sidecar:
              - 'src/rsmm/**'
              - 'src/loader/**'
              - 'data/**'
              - 'scripts/build-sidecar.py'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'
            ts:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'biome.json'
              - 'turbo.json'
              - 'tsconfig.json'
              - 'scripts/audit-supply-chain.mjs'
              - '.github/workflows/ci.yml'
            loader:
              - 'src/loader/**'
              - 'tests/lua/**'
              - 'data/symbols.json'
              - 'scripts/validate_loader_dll.py'
              - '.github/workflows/ci.yml'
            docs_links:
              - 'apps/docs/src/content/**'
              - '.github/workflows/ci.yml'

  # Informational: says in the run summary whether main has commits the
  # published loader / CLI channels do not carry yet. Never fails the job.
  channel-drift:
    name: channels vs main (summary only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # Full history: the last publish commit can be anywhere behind HEAD. A
      # shallow checkout makes the report say "unknown (shallow clone)".
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Report drift in the job summary
        run: python3 src/rsmm/dev/channel_drift.py --markdown >> "$GITHUB_STEP_SUMMARY" || true

  python:
    name: python ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # RSMM targets Windows + Linux only (macOS support dropped).
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      # Match the Python version used by .github/workflows/release.yml
      # (3.12), so any test that passes here also passes in the frozen
      # PyInstaller bundle CI ships to users.
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev deps
        run: python -m pip install --upgrade pip pytest pytest-xdist ruff

      # luac for tests/test_loader_lua.py: the accidental-global scan and the
      # 200-local headroom check skip without it, so on this job they never ran.
      - name: Install Lua (luac)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: ruff
        run: ruff check src/ tests/ scripts/

      - name: pytest
        run: python -m pytest -q -n auto

      - name: docs-gen up to date
        if: runner.os == 'Linux'  # docs are platform-independent; check once
        env:
          PYTHONPATH: src
        run: python -m rsmm.cli.docs_gen_cmd --check

      # Mods must be data, not code: fails on stray discovery scripts and
      # malformed manifests. Platform-independent, so check once on Linux.
      - name: rsmm lint (mods ship data, not scripts)
        if: runner.os == 'Linux'
        env:
          PYTHONPATH: src
        run: python -m rsmm.cli.lint

      # Symbol map (data/symbols.json) must validate and its generated
      # loader header + python constants must be in lockstep with it.
      - name: rsmm symbols (map valid + generated files fresh)
        if: runner.os == 'Linux'
        env:
          PYTHONPATH: src
        run: |
          python -m rsmm.cli.cmd_symbols check
          python -m rsmm.cli.cmd_symbols gen --check

  # The desktop app runs the CLI as a frozen PyInstaller binary, which is the
  # build users actually get and the one a source-tree pytest never touches.
  # Build it the way release.yml does and run it from an empty folder: a data
  # file left out of the bundle, or a subcommand that no longer starts frozen,
  # fails here instead of on a user's fresh install.
  sidecar:
    name: sidecar ${{ matrix.os }} (frozen CLI build + check)
    needs: changes
    if: needs.changes.outputs.sidecar == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install rsmm + PyInstaller
        run: |
          python -m pip install --upgrade pip pyinstaller
          pip install -e .

      - name: Build the sidecar and check it
        run: python scripts/build-sidecar.py

  ts:
    name: typescript (biome + tsc + vitest)
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          version: 9.12.0

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Supply-chain audit (lockfile vs known-bad versions)
        run: pnpm audit:supply-chain

      - name: Rebuild lifecycle scripts (post-audit)
        run: pnpm rebuild

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check-types

      - name: Test
        run: pnpm test

      # Builds the Starlight docs site; starlight-links-validator fails the
      # build on any broken internal link, so doc rot is caught in CI.
      - name: Build docs (validate internal links)
        run: pnpm --filter docs build

  loader-linux-mingw:
    name: loader (mingw-w64 cross-compile)
    needs: changes
    if: needs.changes.outputs.loader == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install mingw-w64 + cmake + lua
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 cmake build-essential lua5.4

      # The SDK prelude (src/loader/lib/rsmm.lua) is engine-mutating pointer
      # code loaded into the game at runtime. rsmm_spec.lua exercises it under
      # a mocked native layer (fake byte-memory + engine-call emulator) — the
      # only automated coverage the loader has. Run it here where lua exists;
      # the pytest wrapper (tests/test_loader_lua.py) skips when it doesn't.
      - name: Loader SDK Lua unit tests
        run: lua5.4 tests/lua/rsmm_spec.lua src/loader/lib

      - name: Build loader DLL
        run: bash src/loader/build.sh

      # Smoke-test the artifact: the loader can only be *run* inside the
      # game, but CI can prove the DLL is a well-formed winhttp proxy with
      # its forwarder exports intact — the exact regression that silently
      # shipped an exportless/missing DLL in 0.1.11.
      - name: Validate winhttp.dll (PE + export contract)
        run: python3 scripts/validate_loader_dll.py dist/winhttp.dll

      - name: Upload winhttp.dll
        uses: actions/upload-artifact@v6
        with:
          name: winhttp-dll
          path: dist/winhttp.dll
          if-no-files-found: error

  docs-links:
    name: docs external links (lychee)
    needs: changes
    if: needs.changes.outputs.docs_links == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          # Only check external links. --root-dir lets lychee resolve
          # root-relative links to file:// URIs (otherwise it hard-errors);
          # excluding the file scheme then skips all internal links, which
          # are already validated by starlight-links-validator at build.
          # The llms*.txt endpoints are excluded because checking them is
          # circular: they are generated by the docs/www builds, so a NEW one
          # 404s on the live site until the very commit that adds it is
          # deployed — which is exactly when the link first needs to pass CI.
          # Nothing is lost by skipping them: a missing endpoint fails the
          # site build, not the link check.
          # The VS Code Marketplace answers automated requests with 503 (the
          # whole site, from the runner and from curl, 2026-10-06), so its
          # state says nothing about our docs: excluded rather than accepting
          # 503 everywhere, which would hide real outages.
          args: >-
            --no-progress --root-dir "$GITHUB_WORKSPACE"
            --exclude '^file://' --exclude-path 'node_modules'
            --exclude '^https?://(localhost|127\.0\.0\.1|example\.com)'
            --exclude '^https?://([a-z]+\.)?rsmm\.me/llms[a-z-]*\.txt$'
            --exclude '^https://marketplace\.visualstudio\.com/'
            --accept 200,206,403,429 --max-retries 2 --max-concurrency 4
            'apps/docs/src/content/docs/**/*.md'
            'apps/docs/src/content/docs/**/*.mdx'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
