name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: python ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # RSMM targets Windows + Linux only (macOS support dropped).
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Match the Python version used by .github/workflows/release.yml
      # (3.12), so any test that passes here also passes in the frozen
      # PyInstaller bundle CI ships to users.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev deps
        run: python -m pip install --upgrade pip pytest pytest-xdist ruff

      - name: ruff
        run: ruff check src/ tests/ scripts/

      - name: pytest
        run: python -m pytest -q -n auto

      - name: docs-gen up to date
        if: runner.os == 'Linux'  # docs are platform-independent; check once
        env:
          PYTHONPATH: src
        run: python -m rsmm.cli.docs_gen_cmd --check

      # Mods must be data, not code: fails on stray discovery scripts and
      # malformed manifests. Platform-independent, so check once on Linux.
      - name: rsmm lint (mods ship data, not scripts)
        if: runner.os == 'Linux'
        env:
          PYTHONPATH: src
        run: python -m rsmm.cli.lint

      # Symbol map (data/symbols.json) must validate and its generated
      # loader header + python constants must be in lockstep with it.
      - name: rsmm symbols (map valid + generated files fresh)
        if: runner.os == 'Linux'
        env:
          PYTHONPATH: src
        run: |
          python -m rsmm.cli.cmd_symbols check
          python -m rsmm.cli.cmd_symbols gen --check

  ts:
    name: typescript (biome + tsc + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Supply-chain audit (lockfile vs known-bad versions)
        run: pnpm audit:supply-chain

      - name: Rebuild lifecycle scripts (post-audit)
        run: pnpm rebuild

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check-types

      - name: Test
        run: pnpm test

      # Builds the Starlight docs site; starlight-links-validator fails the
      # build on any broken internal link, so doc rot is caught in CI.
      - name: Build docs (validate internal links)
        run: pnpm --filter docs build

  loader-linux-mingw:
    name: loader (mingw-w64 cross-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 + cmake + lua
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 cmake build-essential lua5.4

      # The SDK prelude (src/loader/lib/rsmm.lua) is engine-mutating pointer
      # code loaded into the game at runtime. rsmm_spec.lua exercises it under
      # a mocked native layer (fake byte-memory + engine-call emulator) — the
      # only automated coverage the loader has. Run it here where lua exists;
      # the pytest wrapper (tests/test_loader_lua.py) skips when it doesn't.
      - name: Loader SDK Lua unit tests
        run: lua5.4 tests/lua/rsmm_spec.lua src/loader/lib

      - name: Build loader DLL
        run: bash src/loader/build.sh

      # Smoke-test the artifact: the loader can only be *run* inside the
      # game, but CI can prove the DLL is a well-formed winhttp proxy with
      # its forwarder exports intact — the exact regression that silently
      # shipped an exportless/missing DLL in 0.1.11.
      - name: Validate winhttp.dll (PE + export contract)
        run: python3 scripts/validate_loader_dll.py dist/winhttp.dll

      - name: Upload winhttp.dll
        uses: actions/upload-artifact@v4
        with:
          name: winhttp-dll
          path: dist/winhttp.dll
          if-no-files-found: error

  docs-links:
    name: docs external links (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          # Only check external links. --root-dir lets lychee resolve
          # root-relative links to file:// URIs (otherwise it hard-errors);
          # excluding the file scheme then skips all internal links, which
          # are already validated by starlight-links-validator at build.
          args: >-
            --no-progress --root-dir "$GITHUB_WORKSPACE"
            --exclude '^file://' --exclude-path 'node_modules'
            --exclude '^https?://(localhost|127\.0\.0\.1|example\.com)'
            --accept 200,206,403,429 --max-retries 2 --max-concurrency 4
            'apps/docs/src/content/docs/**/*.md'
            'apps/docs/src/content/docs/**/*.mdx'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
