# Scheduled malware re-scan. VirusTotal signatures improve over time, so a
# mod that scanned clean at upload can later be recognised as malware. This
# job pokes the API's guarded /api/mods/rescan endpoint, which re-scans the
# least-recently-checked version(s) and purges any that now trip.
#
# Keep the batch small: each version costs up to 4 VirusTotal lookups and the
# free tier is 4/min, so re-scan a little and often rather than a lot rarely.
#
# Requires two repo secrets:
#   RESCAN_API_URL  — base URL of the API, e.g. https://api.rsmm.me
#   RESCAN_SECRET   — must equal the API's CRON_SECRET env var
name: rescan

on:
  schedule:
    # Every 30 minutes → ~48 versions/day, well under the 500/day free quota.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Versions to re-scan this run (1-10)'
        required: false
        default: '1'

concurrency:
  group: rescan
  cancel-in-progress: false

jobs:
  rescan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger re-scan
        env:
          API_URL: ${{ secrets.RESCAN_API_URL }}
          SECRET: ${{ secrets.RESCAN_SECRET }}
          LIMIT: ${{ github.event.inputs.limit || '1' }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$SECRET" ]; then
            echo "RESCAN_API_URL / RESCAN_SECRET not set — skipping."
            exit 0
          fi
          code=$(curl -sS -o /tmp/rescan.json -w '%{http_code}' \
            -X POST "$API_URL/api/mods/rescan?limit=$LIMIT" \
            -H "Authorization: Bearer $SECRET")
          echo "HTTP $code"
          cat /tmp/rescan.json
          echo
          # A non-2xx is a real failure worth surfacing in the Actions UI.
          case "$code" in 2*) exit 0 ;; *) exit 1 ;; esac
