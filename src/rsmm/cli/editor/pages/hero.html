<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Builder</title>
<style>{{common.css}}</style>
<style>
body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
header { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 10px 16px;
         border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 3; }
header h1 { font-size: 16px; margin: 0 6px 0 0; }
header label { display: flex; gap: 6px; align-items: center; }
#layout { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 18px; max-width: 1180px; margin: 0 auto; padding: 16px 16px 140px; }
nav { position: sticky; top: 64px; align-self: start; display: flex; flex-direction: column; gap: 2px; }
nav button { text-align: left; border: 1px solid transparent; background: none; border-radius: 8px; padding: 6px 10px; display: flex; justify-content: space-between; gap: 6px; }
nav button:hover { border-color: var(--line); }
nav button.on { background: var(--accentbg); border-color: var(--accentline); font-weight: 600; }
nav .n { color: var(--muted); font-size: 12px; font-weight: 400; }
nav .bad { color: var(--bad); }
main { min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
.card > h2 { font-size: 15px; margin: 0 0 2px; display: flex; gap: 8px; align-items: center; }
.card > h2 .grow { flex: 1; }
.lead { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.rec { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 7px 10px; align-items: center; }
.rec > label { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.rec > label[title] { text-decoration: underline dotted; text-underline-offset: 3px; cursor: help; }
.rec > .val { min-width: 0; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.rec > .val > input:not([type=checkbox]):not([type=color]), .rec > .val > select, .rec > .val > textarea { flex: 1; min-width: 120px; width: 100%; }
.rec > .x button { font-size: 12px; padding: 1px 7px; }
.rec .unit { color: var(--muted); font-size: 12px; white-space: nowrap; }
.rec .sub { grid-column: 2 / -1; }
.rec > .val > .hint { flex-basis: 100%; color: var(--muted); font-size: 11.5px; line-height: 1.35; margin-top: -2px; }
.kv { display: grid; gap: 5px; width: 100%; }
.kvrow { display: flex; gap: 6px; align-items: center; }
.kvrow > input { flex: 1; min-width: 0; }
.kvrow.new > input { border-style: dashed; }
textarea { min-height: 56px; resize: vertical; font: inherit; }
textarea.code { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; min-height: 90px; }
.add { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.add select { max-width: 260px; }
.item { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 8px 0; background: var(--bg); }
.item > .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.item > .bar .t { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item > .bar .t .muted { font-weight: 400; }
.item > .bar button { font-size: 12px; padding: 1px 8px; }
.item.closed > :not(.bar) { display: none; }
.item.closed > .bar { margin-bottom: 0; }
.item .item { background: var(--panel); }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
.tabs button { border-radius: 999px; padding: 4px 12px; }
.tabs button.on { background: var(--accent); color: var(--onaccent); border-color: var(--accent); }
.tabs button.off { color: var(--muted); border-style: dashed; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.tiers { display: flex; gap: 4px; flex-wrap: wrap; }
.tiers input { width: 72px; }
.colors { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.colors .c { display: flex; gap: 3px; align-items: center; border: 1px solid var(--line); border-radius: 7px; padding: 2px 4px; }
.colors input[type=color] { width: 30px; height: 24px; padding: 0; border: none; background: none; }
.colors input[type=number] { width: 54px; }
.note { font-size: 12px; color: var(--muted); }
.warn { background: var(--warnbg); color: var(--warn); border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-bottom: 12px; }
#problems { margin: 0; padding-left: 18px; }
#problems li { cursor: pointer; } #problems li:hover { text-decoration: underline; }
footer { position: fixed; bottom: 0; left: 0; right: 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
         padding: 10px 16px; background: var(--panel); border-top: 1px solid var(--line); z-index: 3; }
#status { flex: 1; min-width: 200px; } #status.bad { color: var(--bad); } #status.ok { color: var(--ok); }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); width: min(820px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog pre { white-space: pre-wrap; font-size: 12px; max-height: 60vh; overflow: auto; background: var(--bg); padding: 8px; border-radius: 8px; }
.empty { color: var(--muted); font-style: italic; padding: 6px 0; }
/* Files: a tree of the mod's art beside a preview of the picked file. */
.files { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 14px; min-height: 420px; }
.files.drop { outline: 2px dashed var(--accentline); outline-offset: 6px; border-radius: 10px; }
.tree { border: 1px solid var(--line); border-radius: 10px; padding: 6px; overflow: auto; max-height: 70vh; background: var(--bg); }
.tree .dir { font-weight: 600; font-size: 13px; padding: 6px 6px 2px; color: var(--muted); cursor: pointer; user-select: none;
  display: flex; gap: 5px; align-items: center; }
.tree .ico { display: inline-flex; flex: none; }
.tree .ico-chevron { transition: transform .12s; }
.tree .dir.closed .ico-chevron { transform: rotate(-90deg); }
.tree .f .ico { color: var(--muted); }
.tree .f .ico-image { color: #2a9d8f; }
.tree .f .ico-model { color: #8a6fd1; }
.tree .f.on .ico { color: inherit; }
.tree .f { display: flex; gap: 6px; align-items: center; width: 100%; text-align: left; border: 1px solid transparent; background: none;
  border-radius: 7px; padding: 4px 6px 4px 16px; font-size: 13px; }
.tree .f:hover { border-color: var(--line); }
.tree .f.on { background: var(--accentbg); border-color: var(--accentline); }
.tree .f .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree .f .sz { color: var(--muted); font-size: 11px; }
.tree .f .unused { color: var(--warn); font-size: 11px; }
.preview { min-width: 0; }
.preview .stage { border: 1px solid var(--line); border-radius: 10px; min-height: 360px; display: grid; place-items: center; overflow: hidden;
  background-color: #fff; background-image: linear-gradient(45deg, #ddd 25%, transparent 25%), linear-gradient(-45deg, #ddd 25%, transparent 25%),
  linear-gradient(45deg, transparent 75%, #ddd 75%), linear-gradient(-45deg, transparent 75%, #ddd 75%);
  background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0; }
.preview .stage.dark { background: #1b1b1f; }
.preview .stage img { max-width: 100%; max-height: 60vh; image-rendering: auto; }
.preview .stage canvas { width: 100%; height: 420px; display: block; cursor: grab; }
.preview .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
.preview .meta .grow { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.preview ul { margin: 4px 0 0; padding-left: 18px; font-size: 13px; }
@media (max-width: 760px) { .files { grid-template-columns: 1fr; } }
@media (max-width: 760px) {
  #layout { grid-template-columns: 1fr; }
  nav { position: static; flex-direction: row; flex-wrap: wrap; }
  .rec { grid-template-columns: 1fr auto; }
  .rec > label { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<header>
  <h1>Hero Builder</h1>
  <label>Mod <select id="mod"></select></label>
  <label>Hero <select id="pick"></select></label>
  <span id="busy" class="muted tiny"></span>
</header>
<div id="layout">
  <nav id="nav" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<footer>
  <div id="status" class="muted">Loading…</div>
  <button id="undo" type="button" title="Undo the last change (Ctrl+Z)" disabled>Undo</button>
  <button id="redo" type="button" title="Redo what was undone (Ctrl+Shift+Z)" disabled>Redo</button>
  <button id="reset" type="button" title="Throw away every change since the hero was opened or saved" disabled>Reset</button>
  <button id="remove" type="button" hidden>Remove hero</button>
  <button id="build" type="button" title="Builds every file of the hero into a throwaway folder, exactly as rsmm apply would (about half a minute)">Build check</button>
  <button id="check" type="button">Check</button>
  <button id="save" type="button" class="primary">Save hero</button>
</footer>
<dialog id="buildDlg">
  <h3 id="buildTitle" style="margin:0 0 8px">Build check</h3>
  <div id="buildBody"></div>
  <form method="dialog" style="text-align:right;margin-top:10px"><button>Close</button></form>
</dialog>

<datalist id="dl-fx"></datalist>
<datalist id="dl-own"></datalist>

<datalist id="dl-slot"></datalist>
<datalist id="dl-stat"></datalist>
<datalist id="dl-template"></datalist>
<datalist id="dl-ui"></datalist>
<datalist id="dl-enemy"></datalist>
<datalist id="dl-fxmesh"></datalist>
<datalist id="dl-fxmat"></datalist>
<datalist id="dl-wmesh"></datalist>
<datalist id="dl-wmat"></datalist>
<datalist id="dl-bone"></datalist>
<datalist id="dl-tclip"></datalist>

<script>{{common.js}}</script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "text") e.textContent = v;
    else if (k === "value") e.value = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids) if (k != null && k !== false) e.append(k);
  return e;
}
const clone = (v) => JSON.parse(JSON.stringify(v));
const NEW = "__new__";
const SLOT_LABEL = { attack: "Attack", power: "Power", special: "Special", defense: "Defense",
  trait: "Trait", dash: "Dash", ultimate: "Ultimate 1", ultimate2: "Ultimate 2" };
const RARITY = ["Common", "Rare", "Epic", "Legendary"];
const S = { schema: null, mod: NEW, block: NEW, heroes: [], others: [], hero: null, dirty: false,
  section: "hero", slot: "attack", files: [], rig: null, clips: null, problems: [], tags: [],
  templates: [], projectiles: [] };
// Files made before the mod exists wait in a draft folder of this page's own
// and move into the mod when it is first saved.
const DRAFT = Array.from(crypto.getRandomValues(new Uint8Array(12)), b => (b % 36).toString(36)).join("");
const where = () => S.mod === NEW ? { mod: "", draft: DRAFT } : { mod: S.mod };
const whereName = () => S.mod === NEW ? "this hero (it moves into the mod when you save)" : S.mod;
const setStatus = (cls, text) => { $("status").className = cls; $("status").textContent = text; };
function changed() { remember(); S.dirty = S.last !== S.saved; tellShell(); refreshLists(); drawNav(); }

// ---- history: undo, redo, reset ------------------------------------------------------------
// Every change keeps the hero as it was before; a burst of typing in one field
// is one step. Files already written into the mod (uploads, starters) stay.
const HISTORY_MAX = 200;
function startHistory() {
  S.past = []; S.future = []; S.last = S.saved = JSON.stringify(S.hero); S.lastAt = 0;
  historyButtons();
}
function remember() {
  if (!S.past) { startHistory(); return; }
  const now = JSON.stringify(S.hero);
  if (now === S.last) return;
  if (Date.now() - S.lastAt > 800 || !S.past.length) {
    S.past.push(S.last);
    if (S.past.length > HISTORY_MAX) S.past.shift();
  }
  S.lastAt = Date.now(); S.future = []; S.last = now;
  historyButtons();
}
function historyButtons() {
  $("undo").disabled = !S.past?.length; $("redo").disabled = !S.future?.length;
  $("reset").disabled = S.last === S.saved;
}
async function restore(state, what) {
  const rig = F()?.rig;
  S.last = state; S.lastAt = 0; S.hero = JSON.parse(state);
  S.dirty = S.last !== S.saved;
  if (F().rig !== rig) {          // a rig of its own: its slots, bones and clips
    S.rig = F().rig ? await api("api/rig?rig=" + encodeURIComponent(F().rig)).catch(() => null) : null;
    opts("dl-slot", S.rig?.slots || []); opts("dl-bone", S.rig?.bones || []);
    await loadClips();
  }
  refreshLists(); draw(); tellShell(); historyButtons();
  setStatus("muted", what);
}
function undo() {
  if (!S.past.length) return;
  S.future.push(S.last);
  restore(S.past.pop(), `Undone (${S.past.length} more to undo). Files already written into the mod stay in Files.`);
}
function redo() {
  if (!S.future.length) return;
  S.past.push(S.last);
  restore(S.future.pop(), `Redone (${S.future.length} more to redo).`);
}
function resetHero() {
  if (S.last === S.saved || !confirm("Throw away every change since this hero was opened or last saved? (Undo brings them back.)")) return;
  S.past.push(S.last); S.future = [];
  restore(S.saved, "Back to the hero as it was opened or last saved. Undo brings your changes back; files already written stay in Files.");
}

// ---- field specs ------------------------------------------------------------------------
// How each key is edited. A key with no spec gets an editor for the type of
// its value (JSON for tables and lists), so whatever the build takes can be set.
const num = (unit, hint) => ({ t: "num", unit, hint });
const txt = (hint, list) => ({ t: "text", hint, list });
const SOUND = txt('a sound the game ships: type a hero or a word (Impact, Swing) and pick one', "dl-sound");
const FX = { t: "text", list: "dl-fx", hint: "fx:<one of your effects>, or a shipped Settings\\…\\<name>.vfx.ot" };
const CLIP = { t: "text", list: "dl-anim", hint: "anim:<one of your animations>, or a shipped clip path" };
const UI = { t: "file", ext: ".png", folder: "art/ui", starter: "picture", list: "dl-ui",
  hint: "a .png in the mod (art/…), or a shipped UI path (Heroes\\…\\x.png)" };
const PNG = (folder, hint) => ({ t: "file", ext: ".png", folder, list: "dl-png", hint });
const GLB = (folder, hint, starter) => ({ t: "file", ext: ".glb,.gltf", folder, list: "dl-glb", hint, starter });
const ENUM = (e, hint) => ({ t: "enum", e, hint });
const SPEC = {
  hit: { at: num("s", "seconds after the press"), radius: num("m"), damage: num("%", "% of a hit"),
    stun: num("s", "seconds the enemy is stunned (0..10)"), knockback: num("", "push strength (0..200)"),
    stagger: num("", "stagger power (0..100)"), status: ENUM("status", "a status put on whoever it hits"),
    fx: FX, impact: { ...FX, hint: "played ON each enemy hit" }, shake: ENUM("shake", "camera shake"),
    sound: SOUND, arc: num("°", "a cone ahead of the hero; 0 = all round") },
  indicator: { radius: num("m", "0.2..30"), forward: num("m", "how far ahead (-30..30)"), color: { t: "color" } },
  buff: { stat: { t: "text", list: "dl-stat" }, value: txt('as a talent writes it: "+20%", "+10"'), seconds: num("s", "0..120") },
  strike: { clip: CLIP, duration: num("s", "0..10"), after: num("s", "an enemy already in reach is struck this long in (default 0.25)") },
  combo: { clip: CLIP, duration: num("s", "default: the clip's length"), hit_at: num("s", "when the hit lands"),
    link_at: num("s", "from when the next press chains"), exit_at: num("s", "from when moving ends the step"),
    sound: SOUND, swing: SOUND, swing_at: num("s"), hits: { t: "hits", noAt: true } },
  button: { name: txt("the card's title"), description: { t: "area", hint: "the card's text (#WORD@ = highlight)" },
    icon: { ...UI, hint: "HUD picture: a .png in the mod or a shipped one; empty = the rig's" },
    icon_disabled: { ...UI, hint: "the greyed picture while it cools down (default: made from the icon)" },
    clip: CLIP, cooldown: num("s"), duration: num("s", "how long it holds the hero (default: the clip's length)"),
    charges: { t: "int", hint: "uses before it must cool down (1..20)" },
    sound: { ...SOUND, hint: SOUND.hint + ", played at 0 s" },
    hold: { t: "bool", hint: "ends as soon as the button is let go; duration = the longest hold" },
    loop: { t: "bool", hint: "loops the clip for the whole duration" },
    moving: { t: "bool", hint: "the hero may walk while it plays" },
    passive: { t: "bool", hint: "no button: a card, an icon and an always-on state" },
    intangible: { t: "text", hint: "true, or seconds (0..60): attacks pass through the hero", parse: "boolnum" },
    root_motion: num("×", "how much of the clip's travel moves the hero (0 = in place, 0..5)"),
    hits: { t: "hits" }, indicator: { t: "rec", spec: "indicator" }, buffs: { t: "list", of: "buff", title: (b) => b.stat || "buff" },
    strike: { t: "rec", spec: "strike" }, combo: { t: "combo" }, steps: { t: "steps" },
    add_stats: { t: "stats" }, template: { t: "text", list: "dl-template", hint: '"<Hero>: <button>", a shipped button lent whole' },
    values: { t: "map", vt: "num", kph: "a part of the template", hint: "a number of the lent button to change: its name, then the new value" },
    clips: { t: "map", klist: "dl-tclip", vlist: "dl-anim", kph: "the template's clip", vph: "the clip to play instead",
      hint: "swap a clip of the lent button: pick the template's clip, then the one to play" } },
  stat: { stat: { t: "text", list: "dl-stat" }, values: { t: "tiers" }, percent: { t: "bool", hint: "a percentage (default true)" },
    during: ENUM("ability", "only while that ability is in use"), after: ENUM("ability", "for `seconds` after each use of that ability"),
    on: ENUM("trigger", "for `seconds` after this event"), seconds: num("s"), cooldown: num("s", "at most once every so many seconds"),
    next: ENUM("ability", "until the next use of this ability") },
  action: { on: ENUM("trigger", "fires each time this happens while the talent is owned"), hits: { t: "hits" }, steps: { t: "steps" } },
  talent: { title: txt("the card's title"), description: { t: "area", hint: "{0} = the number, &…~ scales with rarity, #WORD@ highlights" },
    icon: UI, starter: { t: "bool", hint: "in the pick at the start of a run" }, add_stats: { t: "stats" },
    actions: { t: "list", of: "action", title: (a) => a.on ? "on " + a.on : "action" } },
  ultimate: { title: txt(), description: { t: "area" }, icon: UI, add_stats: { t: "stats" },
    actions: { t: "list", of: "action", title: (a) => a.on ? "on " + a.on : "action" } },
  projectile: { model: GLB("art/props", "a .glb in the mod, flying along +Y", "projectile"), albedo: { ...PNG("art/props"), starter: "projectile" },
    mra: PNG("art/props"), normal: PNG("art/props"), scale: num("×"), size: num("×", "hit size"),
    lifetime: num("s"), trail: FX, impact: FX, pierce: { t: "bool", hint: "flies through enemies (default true)" }, pitch: num("°") },
  layer: { texture: { ...PNG("art/fx", "a white shape (.png in the mod), tinted by colors"), starter: "shape" },
    soft: { t: "bool", hint: "fades into the ground" }, material: txt("a shipped material, instead of a texture", "dl-fxmat"),
    mesh: txt('"decal" (on the ground) or a shipped FX mesh (Fan_Flat_Large_180)', "dl-fxmesh"),
    light: num("", "a glow: lights the ground in its colour, as wide as its size"),
    burst: { t: "int", hint: "particles at once" }, rate: num("/s", "particles per second"),
    lifetime: { t: "range", unit: "s" }, size: { t: "range", unit: "m" }, speed: num("m/s"), up: num("m/s", "upward speed"),
    radius: num("m", "spawn radius"), spread: num("°"), rotation: num("°", "random start rotation"), angle: num("°", "facing"),
    gravity: num("", "+ falls, - rises"), drag: num(""), spin: num("°/s"), delay: num("s"), duration: num("s"),
    blend: { t: "int" }, colors: { t: "colors" }, grow: { t: "nums", hint: "size over its life, e.g. 1, 0.6" }, name: txt() },
  animation: { source: GLB("art/anims", "a Blender clip on the rig's skeleton (.glb)", "anim"),
    clip: txt("the clip's name inside the .glb"), template: { t: "text", list: "dl-tpl", hint: "a rig clip lending bone order (e.g. Kintaro_FightingIdle_Loop)" },
    strict: { t: "bool" } },
  slot: { clip: CLIP, duration: num("s"), value: num("", "a number slot (camera distance …)"), bone: txt("a bone of the body (DEF.Chest)", "dl-bone"), texture: UI },
  weapon: { from: ENUM("hero", "the shipped hero whose hand weapon layout it uses"), model: GLB("art/props", "handle along +Y, grip at the origin", "weapon"),
    albedo: { ...PNG("art/props"), starter: "weapon" }, mesh: txt("a shipped weapon mesh (instead of a model)", "dl-wmesh"),
    material: txt("the shipped material it is drawn with", "dl-wmat") },
  memoir: { title: txt(), text: { t: "area" } },
};
// Step blocks: a step is named by its first key.
const STEP_SPEC = {
  fire: { fire: { t: "text", list: "dl-own", hint: "own:<projectile>, or a shipped one" }, angles: { t: "nums", hint: "a fan, degrees (0 = facing)" },
    offsets: { t: "nums", hint: "side by side, metres" }, speed: num("m/s"), damage: num("%"), lifetime: num("s"), size: num("×"),
    knockback: num(""), stagger: num(""), explode: num("m", "burst radius"), forward: num("m", "metres ahead it starts"),
    burn: num("s"), poison: num("s"), root: num("s"), curse: { t: "bool" }, vulnerable: { t: "bool" },
    ricochet: { t: "int" }, ricochet_damage: num("%"), reads: { t: "map", kph: "name", vph: "value", hint: "extra values the projectile reads, by name" } },
  hit: { hit: { t: "rec", spec: "stephit" }, forward: num("m", "metres ahead it lands") },
  heal: { heal: num("", "in the hero's own heal units") },
  summon: { summon: txt("an enemy (Enemies/Wolves/Standard_Wolf_Timber)", "dl-enemy") },

  const key = S.mod + "/" + S.block;
  if (S.historyFor === key && S.past) { S.last = S.saved = JSON.stringify(S.hero); historyButtons(); }
  else { S.historyFor = key; startHistory(); }
  $("remove").hidden = !h;
  if (F().rig) { try { S.rig = await api("api/rig?rig=" + encodeURIComponent(F().rig)); } catch (e) { S.rig = null; } }
  if (ticket !== opening) return;           // another hero was opened meanwhile
  opts("dl-slot", S.rig?.slots || []); opts("dl-bone", S.rig?.bones || []);
  await loadClips();
  if (ticket !== opening) return;
  refreshLists();
  draw();
  const other = S.others.length ? ` This mod also has ${S.others.map(o => `${o.id} (built on ${o.base})`).join(", ")}: heroes built on a shipped one are the Abilities tab's.` : "";
  setStatus("muted", (h ? `Editing ${h.id}.` : "A new hero: give it an id and a name, pick a rig, then write its buttons.") + other);
  if (h) runCheck(true);
}
async function runCheck(quiet) {
  try {
    const { problems } = await api("api/check", { ...where(), hero: payload() });
    S.problems = problems;
    if (!quiet) setStatus(problems.length ? "bad" : "ok", problems.length ? `${problems.length} problem${problems.length === 1 ? "" : "s"}: see the Hero section.` : "✓ No problems found. Build check makes every file to be sure.");
  } catch (e) { if (!quiet) setStatus("bad", e.message); }
  draw();
}
window.rsmmUnsaved = () => S.dirty ? { count: 1, kept: false } : null;
// What is sent: the hero, less the empty tables and lists the page made just
// by showing a section (an empty one the manifest already had stays).
function payload() {
  const h = clone(S.hero), had = S.heroes.find(x => x.id === S.block) || { frame: {} };
  const empty = (v) => v && typeof v === "object" && !Object.keys(v).length;
  for (const k of Object.keys(h.frame || {})) if (empty(h.frame[k]) && !(k in (had.frame || {}))) delete h.frame[k];
  if (empty(h.memoirs) && !("memoirs" in had)) delete h.memoirs;
  return h;
}

$("mod").addEventListener("change", async () => {
  if (S.dirty && !confirm("Leave this hero? Its changes are not saved.")) { $("mod").value = S.mod; return; }
  S.mod = $("mod").value; S.block = NEW;
  try { localStorage.setItem("hb-mod", S.mod); } catch (e) {}
  await loadHeroes(); tellShell();
});
$("pick").addEventListener("change", async () => {
  if (S.dirty && !confirm("Leave this hero? Its changes are not saved.")) { $("pick").value = S.block; return; }
  S.block = $("pick").value; await openHero(); tellShell();
});
$("check").addEventListener("click", () => runCheck(false));
$("undo").addEventListener("click", undo);
$("redo").addEventListener("click", redo);
$("reset").addEventListener("click", resetHero);
// Ctrl+Z / Ctrl+Shift+Z (Ctrl+Y): the hero's history, except while typing,
// where the field's own undo is the one meant.
document.addEventListener("keydown", (e) => {
  if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
  const t = e.target, typing = t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
  if (typing) return;
  const k = e.key.toLowerCase();
  if (k === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
  else if ((k === "z" && e.shiftKey) || k === "y") { e.preventDefault(); redo(); }
});
$("save").addEventListener("click", async () => {
  if (!/^[A-Za-z][A-Za-z0-9]*$/.test(S.hero.id || "")) { S.section = "hero"; draw(); setStatus("bad", "Give your hero an id: letters and digits, starting with a letter."); return; }
  const body = { hero: payload(), block: S.block === NEW ? "" : S.block, draft: DRAFT };
  let error = "";
  try {
    for (;;) {
      let got = null;
      if (S.mod === NEW) { got = await askNewModDialog(S.tags, error); if (!got) return; }
      try {
        const j = await api("api/save", got ? { ...body, create: true, mod: got.id, meta: got.meta } : { ...body, mod: S.mod });
        S.mod = j.mod; S.block = j.block; S.dirty = false; S.historyFor = j.mod + "/" + j.block;
        try { localStorage.setItem("hb-mod", S.mod); } catch (e) {}
        const section = S.section, slot = S.slot;
        await loadMods(); await loadHeroes(); S.section = section; S.slot = slot;
        S.problems = j.problems; draw(); tellShell();
        setStatus(j.problems.length ? "bad" : "ok", j.problems.length
          ? `Saved ${j.block} in ${j.mod}, with ${j.problems.length} problem${j.problems.length === 1 ? "" : "s"} rsmm apply will refuse (see the Hero section).`
          : `✓ Saved ${j.block} in ${j.mod}. Then: rsmm restore --all, rsmm apply, rsmm install-loader, and find it on the hero select screen.`);
        return;
      } catch (e) { if (!got) throw e; error = e.message; }
    }
  } catch (e) { setStatus("bad", e.message); }
});
$("build").addEventListener("click", async () => {
  $("build").disabled = true; setStatus("muted", "Building every file of the hero (about half a minute)…");
  try {
    const r = await api("api/build", { ...where(), hero: payload() });
    $("buildTitle").textContent = r.ok ? `✓ It builds: ${r.files} files in ${r.seconds} s` : "✗ It does not build";
    $("buildBody").replaceChildren(r.ok ? el("p", { class: "lead", text: "Nothing was written to the game or the mod. What the build said:" })
      : el("p", { class: "warn", text: r.error }), r.notes.length ? el("pre", { text: r.notes.join("\n") }) : null);
    $("buildDlg").showModal();
    setStatus(r.ok ? "ok" : "bad", r.ok ? `✓ Build check passed (${r.files} files).` : "Build check failed: " + r.error);
  } catch (e) { setStatus("bad", e.message); }
  $("build").disabled = false;
});
$("remove").addEventListener("click", async () => {
  if (!confirm(`Remove ${S.block} from ${S.mod}'s manifest.toml? Its art files stay in the mod folder.`)) return;
  try { await api("api/delete", { mod: S.mod, block: S.block }); S.block = NEW; S.dirty = false; await loadHeroes(); tellShell(); setStatus("ok", "Removed."); }
  catch (e) { setStatus("bad", e.message); }
});

(async () => {
  try {
    try { S.section = localStorage.getItem("hb-section") || "hero"; } catch (e) {}
    if (!SECTIONS.some(([id]) => id === S.section)) S.section = "hero";
    S.schema = await api("api/schema");
    opts("dl-stat", S.schema.enums.stat);
    try { S.mod = localStorage.getItem("hb-mod") || NEW; } catch (e) {}
    await loadMods();
    await loadHeroes();
    // Slower lists, after the page is up.
    api("api/templates").then(({ templates }) => { S.templates = templates; opts("dl-template", templates.map(t => t.name)); }).catch(() => {});
    api("api/projectiles").then(({ projectiles }) => { S.projectiles = projectiles; refreshLists(); }).catch(() => {});
    api("api/shipped").then((sh) => {
      S.shipped = sh;
      opts("dl-enemy", sh.enemies); opts("dl-fxmesh", sh.fx_meshes); opts("dl-fxmat", sh.fx_materials);
      opts("dl-wmesh", sh.weapon_meshes); opts("dl-wmat", sh.weapon_materials); opts("dl-sound", sh.sounds);
      refreshLists();
    }).catch(() => {});
  } catch (e) { setStatus("bad", e.message); }
  try {
    if (window.parent !== window && window.parent.rsmmReady) window.parent.rsmmReady("hero", async (t) => {
      if (t && t.newHero) { S.block = NEW; $("pick").value = NEW; await openHero(); S.section = "hero"; draw(); }
    });
  } catch (e) { /* not our shell */ }
})();
</script>
</body>
