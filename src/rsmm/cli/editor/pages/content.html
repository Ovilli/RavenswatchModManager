<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Item &amp; Talent Editor</title>
<style>{{common.css}}</style>
<style>
html.embedded .tab { display: none; }
/* Inside `rsmm editor` or the web editor the host's own bar names the tab,
   and this page's header would be an empty strip. */
html.embedded body > header { display: none; }
body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--ink);
       display: grid; grid-template: "top top" auto "left main" 1fr "left bar" auto / 280px 1fr; height: 100vh; }
header { grid-area: top; display: flex; gap: 14px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 16px; margin: 0 10px 0 0; }
select, input, button, textarea { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; }
textarea { width: 100%; resize: vertical; min-height: 58px; }
button { cursor: pointer; } button:hover { border-color: var(--accentline); }
button.primary { background: var(--accent); color: var(--onaccent); border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
.tab { border: none; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 6px 12px; color: var(--muted); }
.tab.on { border-bottom-color: var(--accentline); color: var(--ink); font-weight: 600; }
.muted { color: var(--muted); } .tiny { font-size: 12px; }
code { background: var(--chip); border-radius: 4px; padding: 0 4px; }
#left { grid-area: left; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--panel); }
#left .filters { padding: 10px; display: grid; gap: 6px; border-bottom: 1px solid var(--line); }
#left .filters input, #left .filters select { width: 100%; }
#list { overflow: auto; padding: 6px; flex: 1; }
.pick { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 7px; cursor: pointer; }
.pick:hover { background: var(--chip); } .pick.on { background: var(--accent); color: var(--onaccent); }
.pick .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick .sub { font-size: 12px; opacity: .7; margin-left: auto; flex: none; }
.pick img, .ico { width: 28px; height: 28px; object-fit: contain; flex: none; }
.ico { border-radius: 6px; background: var(--chip); }
#main { grid-area: main; overflow: auto; padding: 16px 22px 30px; min-width: 0; }
.wrap { max-width: 900px; }
.wrap:has(.split) { max-width: 1320px; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; align-items: start; }
.split > aside { position: sticky; top: 0; }
@media (max-width: 1280px) { .split { grid-template-columns: minmax(0, 1fr); } .split > aside { position: static; order: -1; } }
.help { background: var(--accentbg); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
.head { display: flex; gap: 14px; align-items: center; margin-bottom: 8px; }
.head img { width: 64px; height: 64px; object-fit: contain; }
.head h2 { margin: 0; font-size: 20px; }
.sect { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 20px 0 8px; }
.form { display: grid; grid-template-columns: 150px 1fr; gap: 8px 12px; align-items: start; }
.form label { padding-top: 6px; font-weight: 600; }
.form input, .form select { width: 100%; }
.hint { font-size: 12px; color: var(--muted); margin-top: 2px; }
.hint.bad { color: var(--bad); }
.own { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.own .ownimg { width: 48px; height: 48px; object-fit: contain; border-radius: 6px; background: var(--chip); }
.own span { font-size: 12px; color: var(--muted); max-width: 360px; }
.tsrc .own { margin: 0 6px 0 0; }
.upbtn { display: inline-block; cursor: pointer; border: 1px dashed var(--line); border-radius: 7px; padding: 4px 10px; font-size: 13px; background: var(--panel); }
.upbtn:hover, .upbtn:focus-visible { border-color: var(--accentline); color: var(--accentink); }
.icons { display: flex; flex-wrap: wrap; gap: 4px; max-height: 220px; overflow: auto; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.icons button { padding: 2px; border-radius: 6px; }
.icons button.on { border-color: var(--accentline); background: var(--accentbg); }
.icons img { width: 40px; height: 40px; display: block; }
.row { display: grid; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 8px; border: 1px solid transparent; }
.row:nth-child(odd) { background: var(--panel); }
.row.changed { border-color: var(--accentline); background: var(--accentbg); }
.row .lbl { font-weight: 600; word-break: break-word; }
.row .was { font-size: 12px; color: var(--muted); text-align: right; }
.row input[type=number] { width: 100%; }
.tag { font-size: 11px; border-radius: 5px; padding: 0 5px; margin-left: 6px; font-weight: 400; white-space: nowrap; }
.tag.shadow { background: var(--warnbg); color: var(--warn); }
.tag.type { background: var(--chip); color: var(--muted); }
.tag.super { background: var(--accentbg); color: var(--accentink); }
.row { grid-template-columns: 1fr 110px 130px 26px; }
.row.stat { grid-template-columns: 1fr 150px 240px 26px; }
.reset { visibility: hidden; border: none; background: none; padding: 0 4px; color: var(--muted); font-size: 15px; line-height: 1; }
.reset:hover { color: var(--accentink); }
.changed > .reset, .changed .reset.own, label .reset.on { visibility: visible; }
.form label { display: flex; align-items: center; gap: 2px; }
.pickbox { position: relative; }
.pickbox input { width: 100%; }
.picklist { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 2px); max-height: 260px; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.18); padding: 4px; }
.picklist .grp { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 6px 8px 2px; }
.picklist .opt { padding: 4px 8px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; }
.picklist .opt .n { margin-left: auto; font-size: 11px; color: var(--muted); }
.picklist .opt.on, .picklist .opt:hover { background: var(--accentbg); }
.picklist .none { padding: 6px 8px; color: var(--muted); }
.card { background: #1c1b1a; color: #ecebe6; border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: 56px 1fr; gap: 4px 12px; max-width: 520px; box-sizing: border-box; }
.card .ci img, .card .ci .ico { width: 56px; height: 56px; }
.card .ct { font-weight: 700; font-size: 16px; }
.card .cr { font-size: 12px; opacity: .6; }
.card .cd, .card .cs { grid-column: 1 / -1; white-space: pre-wrap; }
.card .cs { border-top: 1px solid rgba(255,255,255,.12); padding-top: 6px; margin-top: 4px; }
.card .cs .sl { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #f2c14e; display: block; }
.kw { color: #f2c14e; font-weight: 600; }
.val { color: #7ee08a; font-weight: 600; }
.neg { color: #ff7a7a; font-weight: 600; }
.ph { border-bottom: 1px dotted currentColor; cursor: help; }
.legend { font-size: 12px; color: var(--muted); margin-top: 6px; max-width: 520px; }
.legend div { padding: 1px 0; }
.legend b { color: var(--ink); font-weight: 600; }
/* The compendium card, drawn with the game's own textures and bitmap fonts.
   Colours are the ones Item_Description_Model sets: text #ede9c1, the markup
   palette (#f9f6c4 keyword, #1cd92a number, #ff5e5e drawback), one name
   colour per rarity. */
.gcard { position: relative; color: #ede9c1; padding: 20px 22px 18px; background: var(--back) center / cover no-repeat; max-width: 520px; box-sizing: border-box; }
.gcard::after { content: ""; position: absolute; inset: 0; pointer-events: none; border: 20px solid transparent; border-image: var(--frame) 40 / 20px stretch; }
.gcard .kw { color: #f9f6c4; font-weight: normal; }
.gcard .val { color: #1cd92a; font-weight: normal; }
.gcard .neg { color: #ff5e5e; font-weight: normal; }
.gc-head { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
.gc-icon { position: relative; width: 66px; height: 66px; flex: none; }
.gc-icon > * { position: absolute; }
.gc-icon .bg { inset: 11%; width: 78%; height: 78%; }
.gc-icon .it, .gc-icon .ico { inset: 12%; width: 76%; height: 76%; }
.gc-icon .fr { inset: 0; width: 100%; height: 100%; }
.gc-name { color: var(--rarity); }
.gc-plate { display: inline-block; margin-top: 3px; padding: 3px 14px 1px; background: var(--plate) center / 100% 100% no-repeat; color: var(--rarity); }
.gc-super { position: relative; margin-top: 10px; padding: 9px 12px 8px; background: var(--sbg) center / 100% 100% no-repeat; }
.gc-super::before, .gc-super::after { content: ""; position: absolute; width: 60%; height: 100%; background: var(--sborder) left top / 100% 100% no-repeat; pointer-events: none; }
.gc-super::before { left: 0; top: 0; }
.gc-super::after { right: 0; bottom: 0; transform: rotate(180deg); }
.gc-slabel { display: block; color: #f9f6c4; margin-bottom: 2px; }
.gw { display: inline-block; white-space: nowrap; }
.g { display: inline-block; position: relative; vertical-align: top; }
.g > i { position: absolute; background: currentColor; -webkit-mask: var(--atlas) no-repeat; mask: var(--atlas) no-repeat; -webkit-mask-size: var(--msize); mask-size: var(--msize); }
.wrap:has(.tpage) { max-width: 1320px; }
.gc-icon.sq .bg { inset: 6%; width: 88%; height: 88%; }
.gc-icon.sq .it, .gc-icon.sq .ico { inset: 14%; width: 72%; height: 72%; }
.thead { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.thead .portrait, .thead > .ico { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; background: var(--chip); flex: none; }
.thead h2 { margin: 0; font-size: 22px; }
.tname { flex: 1; min-width: 0; }
.tprefix { display: flex; flex-direction: column; gap: 2px; }
.tprefix input { width: 190px; }
.ttools { position: sticky; top: -16px; z-index: 5; display: flex; gap: 10px; align-items: center; padding: 8px 0; background: var(--bg); margin-bottom: 6px; }
.ttools input[type=search] { flex: 1; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: none; border-radius: 0; padding: 5px 10px; background: var(--panel); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: #1c1b1a; color: var(--rc); font-weight: 600; }
.tgrid { display: grid; gap: 12px; }
.tcard { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 16px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--panel); align-items: start; }
.tcard.changed { border-color: var(--accentline); }
.tside { display: grid; gap: 6px; min-width: 0; }
.tside input, .tside textarea { width: 100%; box-sizing: border-box; }
.tside .sect { margin: 8px 0 2px; }
.tsrc { display: flex; align-items: center; font-size: 12px; color: var(--muted); }
.tsrc span { flex: 1; }
.tnums { display: grid; gap: 4px; }
.tnums .row { padding: 4px 8px; }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) repeat(4, 76px) 26px; gap: 6px; align-items: end; padding: 4px 8px; border-radius: 8px; background: var(--bg); }
.trow .lbl { font-weight: 600; word-break: break-word; align-self: center; }
.tier { display: flex; flex-direction: column; font-size: 11px; color: var(--muted); gap: 1px; }
.tier input { width: 100%; box-sizing: border-box; padding: 3px 6px; }
.tier input.on { box-shadow: 0 0 0 2px var(--gilt); }
.tier input.ed { background: var(--accentbg); }
.trow .reset.on { visibility: visible; }
.tnote { font-size: 12px; color: var(--muted); padding: 2px 8px; }
.phn { font-family: ui-monospace, monospace; font-size: 12px; background: var(--chip); border-radius: 4px; padding: 0 4px; margin-right: 2px; }
details.allv { margin-top: 18px; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; background: var(--panel); }
details.allv > summary { cursor: pointer; font-weight: 600; }
@media (max-width: 1150px) { .tcard { grid-template-columns: minmax(0, 1fr); } .trow { grid-template-columns: minmax(0, 1fr) repeat(4, 64px) 26px; } }
.mini { background: #1c1b1a; color: #ecebe6; border-radius: 8px; padding: 6px 10px; font-size: 13px; white-space: pre-wrap; }
.mini .t { font-weight: 700; display: block; }
.draft { display: flex; gap: 10px; align-items: center; background: var(--warnbg); color: var(--warn); border-radius: 10px; padding: 6px 12px; margin-bottom: 10px; font-size: 13px; }
.draft button { padding: 2px 8px; font-size: 12px; }
.headacts { margin-left: auto; }
.pick .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: none; }
details.file { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; background: var(--bg); }
details.file > summary { cursor: pointer; padding: 8px 12px; font-weight: 600; }
details.file > summary span { font-weight: 400; }
details.file .rows { padding: 0 6px 8px; }
.cardbox { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: var(--panel); }
.cardbox.changed { border-color: var(--accentline); }
.cardbox .src { font-size: 12px; color: var(--muted); }
.cardbox input { width: 100%; margin: 6px 0; font-weight: 600; }
dialog#newmoddlg { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); padding: 18px 20px; width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
dialog#newmoddlg::backdrop { background: rgba(0,0,0,.45); }
#newmoddlg h3 { margin: 0 0 4px; }
.nmgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin: 12px 0; }
.nmgrid label, .nmgrid > div { display: flex; flex-direction: column; gap: 3px; font-weight: 600; font-size: 13px; }
.nmgrid .wide { grid-column: 1 / -1; }
.nmgrid input, .nmgrid select, .nmgrid textarea { font-weight: 400; width: 100%; }
.nmgrid .hint { font-weight: 400; }
.nmlabel { font-weight: 600; }
.nmtags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; font-weight: 400; }
.nmtags label { flex-direction: row; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-weight: 400; cursor: pointer; }
.nmtags label:has(input:checked) { border-color: var(--accentline); background: var(--accentbg); }
.nmtags input { width: auto; margin: 0; }
.nmacts { display: flex; justify-content: flex-end; gap: 8px; }
@media (max-width: 560px) { .nmgrid { grid-template-columns: 1fr; } }
.loading { display: flex; align-items: center; gap: 10px; justify-content: center; padding: 40px 20px; color: var(--muted); }
.loading.small { padding: 20px; justify-content: flex-start; }
.spin { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
#bar .left { display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 0; }
#pending { display: flex; flex-wrap: wrap; gap: 6px; }
#pending:empty { display: none; }
.pchip { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); font-size: 12px; padding: 0 2px 0 10px; }
.pchip.open { border-color: var(--accentline); }
.pchip.bad { border-color: var(--bad); color: var(--bad); }
.pchip button { border: none; background: none; padding: 2px 6px; font-size: 12px; }
.pchip .x { color: var(--muted); font-size: 14px; line-height: 1; }
.pchip .x:hover { color: var(--bad); }
.errs div { color: var(--bad); font-size: 12px; }
.row.stat .statnote { grid-column: 1 / -1; margin: 2px 0 0; }
#bar { grid-area: bar; border-top: 1px solid var(--line); background: var(--panel); padding: 8px 14px; display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; max-height: 42vh; }
#bar pre { margin: 0; overflow: auto; background: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 12px; max-height: 26vh; min-height: 40px; }
#bar .acts { display: flex; flex-direction: column; gap: 6px; min-width: 250px; }
#bar .acts .line { display: flex; gap: 6px; }
#bar .acts .line > * { flex: 1; }
#status { grid-column: 1 / -1; font-size: 13px; }
.st-ok { color: var(--ok); } .st-bad { color: var(--bad); } .st-warn { color: var(--warn); }
.results div { padding: 2px 0; }
.empty { padding: 30px; text-align: center; color: var(--muted); }
.grant { display: grid; grid-template-columns: 1fr 120px 26px; gap: 8px; align-items: center; margin-bottom: 6px; }
.openline { display: flex; gap: 6px; } .openline select { flex: 1; min-width: 0; }
</style>
</head>
<body>
<header>
  <h1>Item &amp; Talent Editor</h1>
  <button class="tab" data-tab="items">Items</button>
  <button class="tab" data-tab="talents">Talents</button>
  <button class="tab" data-tab="scripts">Scripts</button>
</header>

<aside id="left">
  <div class="filters">
    <input id="q" type="search" placeholder="Search">
    <select id="rarity"><option value="">All rarities</option></select>
  </div>
  <div id="list"></div>
</aside>

<main id="main"><div class="wrap" id="view"><div class="empty">Loading…</div></div></main>

<section id="bar">
  <div class="left">
    <div id="pending" aria-label="Everything changed so far"></div>
    <pre id="toml" class="muted">Pick something on the left to start.</pre>
  </div>
  <div class="acts">
    <div class="line"><button id="check">Check</button><button id="copy">Copy</button></div>
    <div class="openline"><select id="mod"></select><button id="open" type="button" title="Open this mod to keep working on it">Open</button></div>
    <button id="import" type="button" hidden title="Bring a mod you saved before back into the editor">Open a mod folder…</button>
    <input id="importdir" type="file" hidden>
    <button id="save" class="primary">Add to mod</button>
    <div class="tiny muted">Nothing touches the game until you run <code>rsmm apply</code>.</div>
  </div>
  <div id="status" class="muted"></div>
</section>

<dialog id="newmoddlg" aria-labelledby="nm-title">
  <form method="dialog" id="nmform">
    <h3 id="nm-title">New mod</h3>
    <p class="muted tiny">What people see about your mod in the desktop app and on the store. You can change all of it later in <code>manifest.toml</code>.</p>
    <div class="nmgrid">
      <label>Mod id<input id="nm-id" required pattern="[a-zA-Z0-9][a-zA-Z0-9_\-]*" placeholder="stronger-items" spellcheck="false"><span class="hint">The folder name. Letters, digits, - and _.</span></label>
      <label>Name<input id="nm-name" placeholder="Stronger Items"></label>
      <label>Author<input id="nm-author" placeholder="Your name or handle"></label>
      <label>Version<input id="nm-version" value="0.1.0" pattern="\d+\.\d+\.\d+.*"></label>
      <label class="wide">Summary<input id="nm-summary" maxlength="512" placeholder="One line: what the mod does"></label>
      <label class="wide">Description<textarea id="nm-desc" rows="4" maxlength="8192" placeholder="What changes, how to use it, anything players should know"></textarea></label>
      <div class="wide"><span class="nmlabel">Tags</span><div id="nm-tags" class="nmtags"></div>
        <input id="nm-moretags" placeholder="Other tags, separated by commas"></div>
      <label>Licence<select id="nm-license">
        <option value="">Choose…</option>
        <option>MIT</option><option>CC-BY-4.0</option><option>CC-BY-NC-4.0</option><option>CC0-1.0</option>
        <option>GPL-3.0-or-later</option><option value="All rights reserved">All rights reserved</option>
      </select><span class="hint">Whether others may share or change your mod.</span></label>
      <label>Homepage<input id="nm-home" type="url" placeholder="https://…"></label>
      <label class="wide">Source code<input id="nm-repo" type="url" placeholder="https://github.com/…"></label>
    </div>
    <div id="nm-error" class="st-bad tiny"></div>
    <div class="nmacts"><button value="cancel" formnovalidate>Cancel</button><button id="nm-ok" class="primary" value="ok">Create mod and add</button></div>
  </form>
</dialog>

<script>{{common.js}}</script>
<script>
"use strict";
// The tab to open on: named by the web editor's host (a srcdoc frame has no
// query), else by ?tab= in `rsmm editor`, else Items.
const START_TAB = window.RSMM_TAB || new URLSearchParams(location.search).get("tab") || "items";
const $ = s => document.querySelector(s);
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "text") e.textContent = v;
    else e.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) e.append(k);
  return e;
}
const get = (url) => api(url);
const post = (url, body) => api(url, body);
// Icons are fetched rather than linked, so they reach the API the same way
// every other request does: over HTTP locally, through the in-browser engine
// on the docs site. Each is fetched once.
const iconUrls = new Map();
function iconUrl(stem) {
  if (!iconUrls.has(stem)) {
    iconUrls.set(stem, fetch("api/icon?stem=" + encodeURIComponent(stem))
      .then(r => r.ok ? r.blob() : null).then(b => b && URL.createObjectURL(b)).catch(() => null));
  }
  return iconUrls.get(stem);
}
function iconImg(stem, cls) {
  const hole = el("span", { class: "ico" });
  if (!stem) return hole;
  iconUrl(stem).then(url => {
    if (!url) return;
    const img = el("img", { src: url, alt: "" });
    if (cls) img.className = cls;
    hole.replaceWith(img);
  });
  return hole;
}
function status(text, cls) { const s = $("#status"); s.textContent = text; s.className = cls || "muted"; }
function fmt(v) { return typeof v === "number" ? String(Math.round(v * 10000) / 10000) : String(v); }

// Per-viewer drafts. Storage can be missing or throw (a private window, a
// sandboxed frame), and the page must work the same without it.
const store = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* no storage */ } },
  del(k) { try { localStorage.removeItem(k); } catch { /* no storage */ } },
  keys(prefix) { try { return Object.keys(localStorage).filter(k => k.startsWith(prefix)); } catch { return []; } },
};
const DRAFT = { items: "rsmm.editor.draft.item.", talents: "rsmm.editor.draft.talent." };

// The game's card markup: #word@ is a highlighted keyword, &value~ a number
// (it scales with rarity), $word* a drawback, {N} a value the game fills in. `fill(n, next)` renders
// {N}; `next` is the character after it, so a fraction before "%" can show as one.
// Opening mark -> [closing mark, class]: the game's three text styles.
const MARKUP = { "#": ["@", "kw"], "&": ["~", "val"], "$": ["*", "neg"] };
// "{}" with no number takes the next value in order, as in "cooldown by &{}%~".
function markup(text, fill) {
  let next = 0;
  return markupRuns(text.replace(/\{\}/g, () => "{" + next++ + "}"), fill);
}
function markupRuns(text, fill) {
  const frag = document.createDocumentFragment();
  let i = 0, plain = "";
  const flush = () => { if (plain) { frag.append(plain); plain = ""; } };
  while (i < text.length) {
    const c = text[i];
    if (MARKUP[c]) {
      const close = text.indexOf(MARKUP[c][0], i + 1);
      if (close > i) {
        flush();
        const span = el("span", { class: MARKUP[c][1] });
        span.append(markupRuns(text.slice(i + 1, close), fill));
        frag.append(span); i = close + 1; continue;
      }
    }
    if (c === "{") {
      const m = /^\{(\d+)\}/.exec(text.slice(i));
      if (m) { flush(); frag.append(fill(Number(m[1]), text[i + m[0].length] || "")); i += m[0].length; continue; }
    }
    plain += c; i++;
  }
  flush();
  return frag;
}
// Your own icon: any image the browser can read, scaled to `size` square
// (transparent margins keep its shape) and kept as a PNG data URL, which is
// what the page sends and what a draft stores.
function readIcon(file, size) {
  return new Promise((ok, bad) => {
    if (!file || !/^image\//.test(file.type)) { bad(new Error("pick an image file (PNG works best)")); return; }
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = c.height = size;
      const k = Math.min(size / img.width, size / img.height), w = img.width * k, h = img.height * k;
      c.getContext("2d").drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
      URL.revokeObjectURL(url); ok(c.toDataURL("image/png"));
    };
    img.onerror = () => { URL.revokeObjectURL(url); bad(new Error("that file is not an image this browser can read")); };
    img.src = url;
  });
}
// The page may show images from blob: URLs only, so an uploaded icon is shown
// through one made from its data URL (once per upload).
const uploadUrls = new Map();

  if (!uploadUrls.has(dataUrl)) {
    const bin = atob(dataUrl.split(",", 2)[1] || ""), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    uploadUrls.set(dataUrl, URL.createObjectURL(new Blob([bytes], { type: "image/png" })));
  }
  return uploadUrls.get(dataUrl);
}
function uploadImg(dataUrl, cls) { return el("img", { class: cls || "", alt: "", src: uploadUrl(dataUrl) }); }
// "Upload your own" as a button: a hidden file input behind a label.
function uploadButton(text, size, onicon) {
  const inp = el("input", { type: "file", accept: "image/png,image/*", hidden: "" });
  inp.onchange = async () => {
    const file = inp.files && inp.files[0];
    inp.value = "";
    if (!file) return;
    try { onicon(await readIcon(file, size)); status(""); }
    catch (e) { status(e.message, "st-bad"); }
  };
  return el("label", { class: "upbtn", tabindex: "0", onkeydown: ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); inp.click(); } } }, text, inp);
}
function resetBtn(onclick, title) {
  return el("button", { class: "reset", type: "button", title: title || "Undo this change", onclick }, "↺");
}

// ---- state ------------------------------------------------------------------

  drafts: { items: new Set(), talents: new Set() },   // ids with a saved draft
  restored: "",      // the tab whose open edit came from a draft
  item: null,     // detail of the chosen base

  hero: null, talents: null,

// ---- tabs + left list ----------------------------------------------------------
function setTab(t) {
  S.tab = t;
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  $("#rarity").hidden = t !== "items";
  $("#q").hidden = t === "scripts";
  $("#q").value = "";
  renderList(); renderView(); refresh();
}
document.querySelectorAll(".tab").forEach(b => b.onclick = () => setTab(b.dataset.tab));
$("#q").oninput = renderList;
$("#rarity").onchange = renderList;

function renderList() {
  const list = $("#list"); list.textContent = "";
  const q = $("#q").value.toLowerCase();
  if (S.tab === "items") {
    const r = $("#rarity").value;
    const rows = S.items.filter(i => (!r || i.rarity === r) && (!q || (i.name + " " + i.id).toLowerCase().includes(q)));
    if (!rows.length) list.append(el("div", { class: "empty", text: S.items.length ? "No match." : "No items found. Is the game install readable?" }));
    for (const i of rows) {
      list.append(el("div", { class: "pick" + (S.item && S.item.id === i.id ? " on" : ""), title: i.id, onclick: () => pickItem(i.id) },
        iconImg(i.icon), el("span", { class: "nm", text: i.name }),
        S.drafts.items.has(i.id) ? el("span", { class: "dot", title: "Unfinished edit saved" }) : null,
        el("span", { class: "sub", text: i.rarity })));
    }
  } else if (S.tab === "scripts") {
    list.append(el("div", { class: "empty", text: "Test grants are set on the right. They go into whichever mod you save to." }));
  } else {
    for (const h of S.heroes.filter(h => !q || h.toLowerCase().includes(q))) {
      list.append(el("div", { class: "pick" + (S.hero === h ? " on" : ""), onclick: () => pickHero(h) },
        heroImg(h, S.portraits[h]), el("span", { class: "nm", text: h.replace(/_/g, " ") }),
        S.drafts.talents.has(h) ? el("span", { class: "dot", title: "Unfinished edit saved" }) : null));
    }

}

// ---- items ------------------------------------------------------------------------
async function pickItem(id) {
  const meta = S.items.find(i => i.id === id);
  $("#view").replaceChildren(loadingView("Loading " + ((meta && meta.name) || id) + "…"));
  try {
    S.item = await get("api/item?id=" + encodeURIComponent(id));
  } catch (e) { status(e.message, "st-bad"); renderView(); return; }
  const draft = store.get(DRAFT.items + id);
  S.restored = draft ? "items" : "";
  // A draft from before the switch existed was a copy.
  S.itemEdit = Object.assign(freshItemEdit(), draft ? { mode: "clone" } : {}, draft || {});
  renderList(); renderView(); refresh();
}
function freshItemEdit() {
  // "replace" changes the shipped item itself; "clone" makes a new one beside it.
  return { mode: "replace", id: suggestId(S.item.id), name: "", description: "", rarity: "", icon: "", iconUpload: "", values: {}, stats: {}, superDescription: "",
    autoDesc: false, autoSuper: false, textMiss: [] };
}
function itemChanged(E) {
  return !!(E.name || E.description || E.rarity || E.icon || E.iconUpload || E.superDescription
    || Object.keys(E.values).length || Object.keys(E.stats).length);
}
function talentChanged(E) {
  return !!(Object.keys(E.values).length || Object.keys(E.cards).length
    || Object.keys(E.tiers || {}).length || Object.keys(E.stats || {}).length);
}
// Keep (or drop) the open edit's draft; called on every change.
function saveDraft() {
  if (S.tab === "scripts") return;
  const items = S.tab === "items";
  const id = items ? S.item && S.item.id : S.hero;
  if (!id) return;
  const E = items ? S.itemEdit : S.talentEdit, set = S.drafts[S.tab];
  const had = set.has(id);
  if (items ? itemChanged(E) : talentChanged(E)) {
    const payload = editPayload();
    store.set(DRAFT[S.tab] + id, Object.assign({}, E, { payload }));
    S.pending[S.tab].set(id, payload); set.add(id);
  } else { store.del(DRAFT[S.tab] + id); S.pending[S.tab].delete(id); set.delete(id); }
  if (had !== set.has(id)) renderList();
}
function loadingView(text, small) {
  return el("div", { class: "loading" + (small ? " small" : ""), role: "status" }, el("span", { class: "spin" }), el("span", { text }));
}

// ---- every pending change -----------------------------------------------------------
// Each changed item and hero is kept with the payload it sends, so the bar shows
// and saves all of them together, not only the one that is open. Kept in memory
// always and in the browser as a draft where it can be.
S.pending = { items: new Map(), talents: new Map() };
function pendingName(tab, id) {
  if (tab === "items") {
    const name = (S.items.find(i => i.id === id) || {}).name || id;
    const edit = S.pending.items.get(id) || (isOpen(tab, id) && editPayload());
    return edit && edit.mode === "clone" ? name + " (copy)" : name;
  }
  return id.replace(/_/g, " ") + " talents";
}

  const out = [];
  for (const tab of ["items", "talents"]) for (const [id, edit] of S.pending[tab]) {
    out.push({ tab, id, edit, name: pendingName(tab, id) });
  }
  // The open item shows before it has a change: its block alone makes the copy.
  // A replacement with nothing changed writes nothing.
  if (S.tab === "items" && S.item && S.itemEdit.mode === "clone" && !S.pending.items.has(S.item.id)) {
    out.unshift({ tab: "items", id: S.item.id, edit: editPayload(), name: pendingName("items", S.item.id) });
  }

}

  if (isOpen(tab, id)) {

    S.restored = ""; renderView();

}

  const box = $("#pending"); box.textContent = "";
  const bad = new Set((errors || []).map(e => e.name));
  const grants = scriptChanged();
  if (edits.length + (grants ? 1 : 0) < 2 && !bad.size) return;
  for (const e of edits) {
    const chip = el("span", { class: "pchip" + (isOpen(e.tab, e.id) ? " open" : "") + (bad.has(e.name) ? " bad" : "") },
      el("button", { type: "button", title: "Open it", onclick: () => openPending(e.tab, e.id) }, e.name));
    if (S.pending[e.tab].has(e.id)) {
      chip.append(el("button", { type: "button", class: "x", title: "Drop these changes", "aria-label": "Drop " + e.name, onclick: () => dropPending(e.tab, e.id) }, "×"));
    }
    box.append(chip);
  }
  if (grants) {
    box.append(el("span", { class: "pchip" + (S.tab === "scripts" ? " open" : "") },
      el("button", { type: "button", title: "Open it", onclick: () => setTab("scripts") }, "Test grants"),
      el("button", { type: "button", class: "x", title: "Drop these changes", "aria-label": "Drop the test grants",
        onclick: () => { S.script = JSON.parse(S.scriptSaved); saveScript(); if (S.tab === "scripts") renderView(); refresh(); } }, "×")));
  }
}

function draftBanner(onDiscard) {

// A form label with an undo button for a free-text field.

  "Crit chance": ["#Crit Chance@ {N}", "Gain {N} #Crit Chance@"],
  "Crit damage": ["#Critical Hits@ deal {N} damage", "Critical hits deal {N} damage"],
  "Move Speed Ratio": ["Move Speed {N}", "{N} Move Speed"],
  "Healing effect": ["{N} to any healing effect provided or received"],
  "Shield increase": ["{N} to any #SHIELD@ applied or received"],
  "Increase damage to boss": ["Deal {N} damage to bosses"],
  "CD reduce dash": ["Reduces #DASH@'s cooldown by {N}"],
  "Ability_Charge_Dash": ["#DASH@ gains {N} charge(s)"],

  const T = CARD.tex;
  const icon = el("div", { class: "gc-icon sq" }, el("img", { class: "bg", alt: "", src: T.skill_slot }),
    cardIcon(c, "it"), el("img", { class: "fr", alt: "", src: T["skill_" + rarity] || T.skill_Common }));
  const box = cardFrame(rarity, icon, nameText || c.source, rarity);
  if (descText) box.append(glyphify(el("div", { class: "gc-desc" }, markup(descText, talentFill(c))), CARD.fonts.body, 19));
  return box;
}

// "Skill Attack Dive Damage Multiplier Selector" on the Attack Dive card is
// just "Damage Multiplier": the card already says which talent it is.
function shortLabel(label, source) {
  let out = label;
  const pre = ("Skill " + source + " ").toLowerCase();
  if (out.toLowerCase().startsWith(pre)) out = out.slice(pre.length);
  out = out.replace(/ (Selector|Value)$/, "");
  return out || label;
}

// The numbers behind a card's {N}, each where it can be edited.
function talentNumbers(c, redraw) {
  const E = S.talentEdit, box = el("div", { class: "tnums" });
  c.entries.forEach((e, n) => {
    const tag = el("span", { class: "phn", text: "{" + n + "}" });
    if (!e) { box.append(el("div", { class: "tnote" }, tag, "set inside the talent, not editable here")); return; }
    if (e.tiers) {
      const row = el("div", { class: "trow" }, el("div", { class: "lbl", title: e.node }, tag, " " + shortLabel(e.node, c.source)));
      const keys = TIERS.filter(t => e.tiers[t]).map(t => tierKey(c.file, e.node, e.tiers[t].index));
      const undo = resetBtn(() => { for (const k of keys) delete E.tiers[k]; renderView(); refresh(); });
      undo.classList.add("own");
      const sync = () => undo.classList.toggle("on", keys.some(k => E.tiers[k]));
      for (const tier of TIERS) {
        const t = e.tiers[tier];
        if (!t) { row.append(el("span")); continue; }
        const k = tierKey(c.file, e.node, t.index), cur = E.tiers[k];
        const inp = el("input", { type: "number", step: "any", value: fmt(cur ? cur.new : t.value), title: tier + " (was " + fmt(t.value) + ")", "data-tier": tier });
        inp.oninput = () => {
          const nv = inp.value === "" ? NaN : Number(inp.value);
          if (Number.isNaN(nv) || nv === t.value) delete E.tiers[k];
          else E.tiers[k] = { file: c.file, label: e.node, index: t.index, old: t.value, new: nv };
          inp.classList.toggle("ed", !!E.tiers[k]); sync(); redraw(); refresh();
        };
        inp.classList.toggle("ed", !!cur);
        inp.classList.toggle("on", tier === (E.rarity || "Common"));
        row.append(el("label", { class: "tier" }, el("span", { text: tier }), inp));
      }
      sync();
      row.append(undo);
      box.append(row);
      return;
    }
    const labels = e.kind === "Value" ? [e.node] : e.sources;
    const rows = labels.map(l => [l, talentValue(c.file, l)]).filter(([, r]) => r);
    if (!rows.length) { box.append(el("div", { class: "tnote" }, tag, e.node + " — worked out in game")); return; }
    for (const [label, r] of rows) {
      const key = c.file + "\u0000" + label;
      const vr = valueRow((e.kind === "Value" ? "" : "from ") + shortLabel(label, c.source), r.value, r.type, r.shadowed,
        E.values[key] ? E.values[key].new : undefined, nv => {
          if (nv === undefined) delete E.values[key];
          else E.values[key] = { file: c.file, label, type: r.type, old: r.value, new: nv, shadowed: r.shadowed };
          redraw(); refresh();
        });
      vr.querySelector(".lbl").prepend(tag.cloneNode(true), " ");
      box.append(vr);
    }
  });
  return box;
}

// One talent: its card as the game draws it, and everything that changes it.
function talentRow(c) {
  const E = S.talentEdit, cur = E.cards[c.source] || {};
  const tierEdited = () => c.entries.some(e => e && e.tiers && Object.values(e.tiers).some(t => E.tiers[tierKey(c.file, e.node, t.index)]));
  const row = el("div", { class: "tcard" });
  const preview = el("div", { class: "tprev" });
  const nameIn = el("input", { value: cur.name || c.name, placeholder: c.name || "(no name key)" });
  const descIn = el("textarea", { rows: "3" });
  descIn.value = cur.description || c.description;
  if (!c.hasName) nameIn.disabled = true;
  if (!c.hasDescription) descIn.disabled = true;
  const paint = () => {
    preview.textContent = "";
    preview.append(talentCard(c, nameIn.value || c.name, descIn.value || c.description));
  };
  const redraw = () => {
    TPREV.redraw(preview, paint);
    row.classList.toggle("changed", !!(E.cards[c.source] || tierEdited()));
  };
  const upd = () => {
    const n = nameIn.value.trim() && nameIn.value !== c.name ? nameIn.value : "";
    const d = descIn.value.trim() && descIn.value !== c.description ? descIn.value : "";
    const icon = (E.cards[c.source] || {}).iconUpload || "";
    if (n || d || icon) E.cards[c.source] = { name: n, description: d, ...(icon ? { iconUpload: icon } : {}) };
    else delete E.cards[c.source];
    redraw(); refresh();
  };
  nameIn.oninput = upd; descIn.oninput = upd;
  const setIcon = d => {
    const cur = E.cards[c.source] || { name: "", description: "" };
    if (d) cur.iconUpload = d; else delete cur.iconUpload;
    E.cards[c.source] = cur;
    upd(); drawIconCtl();
  };
  const iconCtl = el("div", { class: "own" });
  const drawIconCtl = () => {
    iconCtl.textContent = "";
    const up = (E.cards[c.source] || {}).iconUpload;
    if (up) iconCtl.append(el("button", { type: "button", onclick: () => setIcon("") }, "Use its own icon again"));
    if (c.icon) iconCtl.append(uploadButton(up ? "Replace icon…" : "Replace icon…", 128, setIcon));
    else iconCtl.append(el("span", { class: "tiny muted", text: "No icon found for this card." }));
  };
  drawIconCtl();
  const undo = resetBtn(() => { nameIn.value = c.name; descIn.value = c.description; setIcon(""); }, "Undo the text and icon changes to this card");
  undo.classList.add("own");
  const side = el("div", { class: "tside" },
    el("div", { class: "tsrc" }, el("span", { text: c.source }), iconCtl, undo),
    nameIn, descIn);
  if (c.entries.length) side.append(el("div", { class: "sect", text: "Numbers" }), talentNumbers(c, redraw));
  row.append(preview, side);
  TPREV.add(preview, paint);
  row.classList.toggle("changed", !!(E.cards[c.source] || tierEdited()));
  return row;
}

// Card previews are the expensive part of the Talents tab (every letter is a
// glyph), so a preview is drawn only while it is on screen; one scrolled away
// is marked stale and drawn when it comes back.
const TPREV = {
  paints: new Map(), stale: new Set(), seen: new Set(), obs: null,
  reset() {
    if (this.obs) this.obs.disconnect();
    this.paints.clear(); this.stale.clear(); this.seen.clear();
    this.obs = "IntersectionObserver" in window ? new IntersectionObserver(es => {
      for (const e of es) {
        if (e.isIntersecting) {
          this.seen.add(e.target);
          if (this.stale.delete(e.target)) this.paints.get(e.target)();
        } else this.seen.delete(e.target);
      }
    }, { root: document.getElementById("main"), rootMargin: "300px 0px" }) : null;
  },
  add(el, paint) {
    this.paints.set(el, paint);
    if (this.obs) { this.stale.add(el); el.style.minHeight = "170px"; this.obs.observe(el); } else paint();
  },
  redraw(el, paint) {
    if (!this.obs || this.seen.has(el)) paint(); else this.stale.add(el);
  },
  // Every preview is out of date (the rarity changed): draw the visible ones now.
  all() {
    for (const [el, paint] of this.paints) this.redraw(el, paint);
  },
};

// Switch the preview rarity: restyle the switch and the highlighted tier boxes
// in place and redraw the cards, without rebuilding the page.
function setTalentRarity(tier, seg) {
  const E = S.talentEdit;
  if ((E.rarity || "Common") === tier) return;
  E.rarity = tier;
  for (const b of seg.children) b.classList.toggle("on", b.textContent === tier);
  for (const inp of document.querySelectorAll(".tier input[data-tier]")) inp.classList.toggle("on", inp.dataset.tier === tier);
  TPREV.all();
  saveDraft();
}

// Every value and effect of the hero, by file, for what the cards do not show.
function allValues() {
  const T = S.talents, E = S.talentEdit;
  const nVals = T.files.reduce((n, f) => n + f.values.length, 0);
  const nMods = T.files.reduce((n, f) => n + f.modifiers.length, 0);
  const d = el("details", { class: "allv" }, el("summary", {}, `All values and effects (${nVals} values, ${nMods} effects)`));
  const changed = Object.keys(E.values).length + Object.keys(E.stats).length;
  if (changed) d.open = true;
  const q = el("input", { type: "search", placeholder: "Filter, e.g. damage", style: "width:100%;margin:8px 0" });
  const box = el("div");
  const draw = () => {
    box.textContent = "";
    const needle = q.value.toLowerCase();
    for (const file of T.files) {
      const rows = file.values.filter(r => !needle || r.label.toLowerCase().includes(needle));
      const mods = file.modifiers.filter(m => !needle || (m.name + " " + m.stat).toLowerCase().includes(needle));
      if (!rows.length && !mods.length) continue;
      const nChanged = file.values.filter(r => (file.file + "\u0000" + r.label) in E.values).length
        + file.modifiers.filter(m => (file.file + "\u0000" + m.name) in E.stats).length;
      const fd = el("details", { class: "file" }, el("summary", {}, file.file,
        el("span", { class: "muted", text: `  ${file.values.length} values, ${file.modifiers.length} effects` + (nChanged ? `, ${nChanged} changed` : "") })));
      if (needle || nChanged) fd.open = true;
      const inner = el("div", { class: "rows" });
      for (const r of rows) {
        const key = file.file + "\u0000" + r.label;
        inner.append(valueRow(r.label, r.value, r.type, r.shadowed, E.values[key] ? E.values[key].new : undefined, nv => {
          if (nv === undefined) delete E.values[key];
          else E.values[key] = { file: file.file, label: r.label, type: r.type, old: r.value, new: nv, shadowed: r.shadowed };
          refresh();
        }));
      }
      for (const m of mods) {
        const key = file.file + "\u0000" + m.name;
        inner.append(statRow(m, E.stats[key], val => {
          if (val === undefined) delete E.stats[key]; else E.stats[key] = val;
          refresh();
        }));
      }
      fd.append(inner); box.append(fd);
    }
  };
  q.oninput = draw;
  d.addEventListener("toggle", () => { if (d.open && !box.childNodes.length) draw(); });
  if (d.open) draw();
  d.append(q, box);
  return d;
}

// ---- scripts: test grants -------------------------------------------------------------
// The Scripts tab sets the editor's own section of the mod's init.lua, which hands
// out items, talents and XP when a run starts. The server writes the Lua; this
// page only edits the settings.
const SCRIPT_KEY = "rsmm.editor.script", LOADED_KEY = "rsmm.editor.loaded";
const TIER_NAMES = ["Common", "Rare", "Epic", "Legendary"];
function emptyScript() { return { hero: "", xp: 0, items: [], talents: [] }; }
// The settings as the server keeps them: a half-filled row is not a change, and
// talents need their hero.
function scriptNorm(c) {
  c = c || emptyScript();
  return JSON.stringify({ hero: c.hero || "", xp: Math.max(0, Math.floor(Number(c.xp) || 0)),
    items: (c.items || []).filter(i => i.id).map(i => ({ id: i.id, count: Math.min(99, Math.max(1, Math.floor(Number(i.count) || 1))) })),
    talents: c.hero ? (c.talents || []).filter(t => t.name).map(t => ({ name: t.name, tier: Number(t.tier) || 0 })) : [] });
}
const NO_GRANTS = scriptNorm(emptyScript());
function scriptChanged() { return !!S.script && scriptNorm(S.script) !== S.scriptSaved; }
function saveScript() { store.set(SCRIPT_KEY, { script: S.script, saved: S.scriptSaved }); }
const talentCards = new Map();
function cardsOf(hero) {
  if (!talentCards.has(hero)) {
    talentCards.set(hero, get("api/talents?hero=" + encodeURIComponent(hero)).then(j => j.cards || []).catch(() => []));
  }
  return talentCards.get(hero);
}

  const xp = el("input", { type: "number", min: "0", max: "1000000", step: "100", value: String(C.xp || 0) });
  xp.oninput = () => { C.xp = Math.max(0, Math.floor(Number(xp.value) || 0)); changed(); };
  f.append(el("label", { text: "Only for" }), el("div", {}, hero,
      el("div", { class: "hint", text: "A mod's script runs for whatever hero you play. Pick one and the grants happen only with that hero." })),
    el("label", { text: "XP" }), el("div", {}, xp, el("div", { class: "hint", text: "5000 takes a new hero from level 1 to 4. 0 gives none." })));
  v.append(el("div", { class: "sect", text: "Who and how much" }), f);

  v.append(el("div", { class: "sect", text: `Items (${C.items.length})` }));
  const items = [...S.items].sort((a, b) => a.name.localeCompare(b.name));
  C.items.forEach((it, i) => {
    const sel = el("select", {}, el("option", { value: "", text: "Pick an item…" }),

    v.append(el("div", { class: "grant" }, sel, n, resetBtn(() => { C.items.splice(i, 1); redraw(); }, "Remove")));
  });
  v.append(el("button", { type: "button", onclick: () => { C.items.push({ id: "", count: 1 }); redraw(); } }, "+ Add an item"));

  v.append(el("div", { class: "sect", text: `Talents (${C.talents.length})` }));
  if (!C.hero) {
    v.append(el("div", { class: "muted", text: "Talents belong to one hero: pick the hero above to choose them." }));
    return v;
  }
  const box = el("div", {}, loadingView("Loading " + C.hero.replace(/_/g, " ") + "'s talents…", true));
  v.append(box);
  cardsOf(C.hero).then(cards => {
    box.textContent = "";
    C.talents.forEach((t, i) => {
      const sel = el("select", {}, el("option", { value: "", text: "Pick a talent…" }),
        ...cards.map(c => el("option", { value: c.source, text: c.name ? `${c.name} (${c.source})` : c.source })));
      sel.value = t.name;
      sel.onchange = () => { t.name = sel.value; changed(); };
      const tier = el("select", {}, ...TIER_NAMES.map((n, k) => el("option", { value: String(k), text: n })));
      tier.value = String(t.tier || 0);
      tier.onchange = () => { t.tier = Number(tier.value); changed(); };
      box.append(el("div", { class: "grant" }, sel, tier, resetBtn(() => { C.talents.splice(i, 1); redraw(); }, "Remove")));
    });
    box.append(el("button", { type: "button", onclick: () => { C.talents.push({ name: "", tier: 0 }); redraw(); } }, "+ Add a talent"));
  });
  return v;
}

// ---- opening a mod -------------------------------------------------------------------
// A saved mod opens back into the page: its items, talents and test grants become
// the changes in the bar, and saving to it puts each changed block in place of the
// old one. Blocks the editor cannot show exactly are listed and left as they are.
// JSON with sorted keys: the page and the server build the same payload in
// different key orders, and an untouched block must not count as changed.
function canon(v) {
  return JSON.stringify(v, (_k, x) => x && typeof x === "object" && !Array.isArray(x)
    ? Object.fromEntries(Object.entries(x).sort(([a], [b]) => (a < b ? -1 : a > b ? 1 : 0))) : x);
}
function loadedEntry(tab, id) { return S.loaded && S.loaded.entries[tab + "\u0000" + id]; }
function editIsNew(e) { const ent = loadedEntry(e.tab, e.id); return !ent || ent.json !== canon(e.edit); }
function hasUnsaved() {
  if (scriptChanged()) return true;
  for (const tab of ["items", "talents"]) for (const [id, edit] of S.pending[tab]) {
    if (editIsNew({ tab, id, edit })) return true;
  }
  return false;
}
// Rebuild the pending changes from the drafts (also when another tab of the
// editor opened a mod: they share the browser's storage).
function syncFromStore() {
  for (const t of ["items", "talents"]) {
    S.pending[t].clear(); S.drafts[t].clear();
    for (const k of store.keys(DRAFT[t])) {
      const id = k.slice(DRAFT[t].length), d = store.get(k);
      S.drafts[t].add(id);
      if (d && d.payload) S.pending[t].set(id, d.payload);    // older drafts join once reopened
    }
  }
  S.loaded = store.get(LOADED_KEY);
  const sc = store.get(SCRIPT_KEY);
  S.script = sc && sc.script ? sc.script : emptyScript();
  S.scriptSaved = sc && typeof sc.saved === "string" ? sc.saved : NO_GRANTS;
}
function reopenCurrent() {
  S.restored = "";
  if (S.item) S.itemEdit = Object.assign(freshItemEdit(), store.get(DRAFT.items + S.item.id) || {});
  if (S.hero && S.talents) S.talentEdit = Object.assign(freshTalentEdit(), store.get(DRAFT.talents + S.hero) || {});
}
async function openMod(id, { ask = true, quiet = false } = {}) {
  if (ask && hasUnsaved() && !confirm("Opening a mod replaces the changes you have not saved. Open it?")) return;
  let j;
  try { j = await get("api/mod?id=" + encodeURIComponent(id)); }
  catch (e) { status(e.message, "st-bad"); return; }
  for (const t of ["items", "talents"]) for (const k of store.keys(DRAFT[t])) store.del(k);
  const entries = {};
  for (const [t, map] of [["items", j.items], ["talents", j.talents]]) {
    for (const [key, e] of Object.entries(map)) {
      store.set(DRAFT[t] + key, Object.assign({}, e.edit, { payload: e.payload }));
      entries[t + "\u0000" + key] = { blocks: e.blocks, json: canon(e.payload) };
    }
  }
  const script = j.script ? JSON.parse(JSON.stringify(j.script)) : emptyScript();
  store.set(SCRIPT_KEY, { script, saved: scriptNorm(script) });
  store.set(LOADED_KEY, { id: j.id, name: j.name, entries, at: Date.now() });
  syncFromStore(); reopenCurrent();
  $("#mod").value = j.id; $("#mod").onchange();
  renderList(); renderView(); await refresh();
  if (quiet) return;
  const n = Object.keys(j.items).length + Object.keys(j.talents).length;
  const kept = j.kept.map(k => `${k.kind} ${k.id}: ${k.why}`);
  flash(`Opened ${j.name}: ${n} item/hero change(s)${j.script ? " and test grants" : ""}. Change anything, then save to it.`
    + (kept.length ? ` Left as they are: ${kept.join("; ")}.` : ""), kept.length ? "st-warn" : "st-ok", kept.length ? 20000 : 6000);
}
window.addEventListener("storage", e => {
  if (e.key !== LOADED_KEY && e.key !== SCRIPT_KEY) return;
  syncFromStore(); reopenCurrent();
  if (S.loaded && $("#mod").value !== S.loaded.id && S.mods.some(m => m.id === S.loaded.id)) {
    $("#mod").value = S.loaded.id; $("#mod").onchange();
  }
  renderList(); renderView(); refresh();
});
$("#open").onclick = () => { const id = $("#mod").value; if (id !== "__new__") openMod(id); };

// The web editor's mods live only in the page, so one saved earlier is brought
// back from its folder: only the files the editor reads are sent.
$("#importdir").webkitdirectory = true;
$("#import").hidden = !window.RSMM_HOSTED;
$("#import").onclick = () => $("#importdir").click();
function fileB64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(",")[1] || "");
    r.onerror = () => rej(new Error("could not read " + file.name));
    r.readAsDataURL(file);
  });
}
$("#importdir").onchange = async () => {
  const list = [...$("#importdir").files];
  $("#importdir").value = "";
  const files = {};
  for (const f of list) {
    const parts = (f.webkitRelativePath || f.name).split("/");
    const rel = parts.slice(1).join("/");
    if (!/^(manifest\.toml|init\.lua|icons\/[A-Za-z0-9_]+\.png)$/.test(rel)) continue;
    files[rel] = await fileB64(f);
    files._folder = parts[0];
  }
  if (!files["manifest.toml"]) { status("That folder has no manifest.toml. Pick the mod's own folder.", "st-bad"); return; }
  if (hasUnsaved() && !confirm("Opening a mod replaces the changes you have not saved. Open it?")) return;
  try {
    const j = await post("api/import", { files });
    S.mods = (await get("api/mods")).mods; renderMods();
    await openMod(j.id, { ask: false });
  } catch (e) { status(e.message, "st-bad"); }
};

// ---- the blocks ----------------------------------------------------------------------
function editPayload() {
  if (S.tab === "items") {
    if (!S.item) return null;
    const E = S.itemEdit;
    return { mode: E.mode === "clone" ? "clone" : "replace", base: S.item.id, id: E.id, name: E.name, description: E.description, rarity: E.rarity, icon: E.icon, iconUpload: E.iconUpload || "",
      stats: Object.entries(E.stats).map(([modifier, stat]) => ({ modifier, stat })), superDescription: E.superDescription,
      values: Object.entries(E.values).map(([label, nv]) => ({ label, old: S.item.values.find(r => r.label === label).value, new: nv,
        shadowed: S.item.values.find(r => r.label === label).shadowed })) };
  }
  if (!S.talents) return null;
  const E = S.talentEdit;
  return { hero: S.hero, prefix: E.prefix, values: Object.values(E.values), tiers: Object.values(E.tiers),
    stats: Object.entries(E.stats).map(([k, stat]) => { const [file, modifier] = k.split("\u0000"); return { file, modifier, stat }; }),
    cards: Object.entries(E.cards).map(([source, c]) => ({ source, ...c })) };
}

let lastToml = "", lastEdits = [], tick = 0;
function editsBody(edits) { return { edits: edits.map(e => ({ tab: e.tab, edit: e.edit, name: e.name })) }; }
async function refresh() {
  renderPreview();
  const me = ++tick;
  clearTimeout(statusTimer); status("");        // an edit makes the last check's verdict stale
  $("#check").disabled = $("#save").disabled = $("#copy").disabled = true;
  await new Promise(r => setTimeout(r, 150));
  if (me !== tick) return;
  saveDraft();
  const edits = pendingEdits();
  lastEdits = edits;
  renderPending(edits, []);
  const grants = scriptNorm(S.script) !== NO_GRANTS;
  if (!edits.length && !grants && !scriptChanged()) {
    $("#toml").textContent = "Nothing changed yet. Pick an item or a hero on the left.";
    $("#toml").className = "muted"; lastToml = ""; return;
  }
  try {
    const j = await post("api/toml", Object.assign(editsBody(edits), grants ? { script: JSON.parse(scriptNorm(S.script)) } : {}));
    if (me !== tick) return;
    renderPending(edits, j.errors);
    lastToml = j.toml;
    const pre = $("#toml"); pre.textContent = ""; pre.className = j.toml || j.lua ? "" : "muted";
    if (j.errors.length) {
      pre.append(el("div", { class: "errs" }, ...j.errors.map(e => el("div", { text: "✗ " + (e.name ? e.name + ": " : "") + e.error }))));
    }
    pre.append(j.toml || (j.errors.length || j.lua ? "" : "Nothing changed yet."));
    if (j.lua) pre.append((j.toml ? "\n" : "") + "# init.lua, the editor's section:\n" + j.lua);
    else if (scriptChanged()) pre.append((j.toml ? "\n" : "") + "# init.lua: the test grants are taken out\n");
    $("#copy").disabled = !j.toml;
    $("#check").disabled = !j.blocks || j.errors.length > 0;
    $("#save").disabled = j.errors.length > 0 || !(j.blocks || scriptChanged());
  } catch (e) {
    if (me !== tick) return;
    lastToml = ""; $("#toml").textContent = e.message; $("#toml").className = "st-warn";
  }
}

$("#copy").onclick = async () => {
  try { await navigator.clipboard.writeText(lastToml); flash("Copied. Paste it at the end of a mod's manifest.toml.", "st-ok", 3500); }
  catch { flash("The browser blocked the clipboard. Select the text and copy it.", "st-warn", 6000); }
};

$("#check").onclick = async () => {
  clearTimeout(statusTimer);
  status("Building with the real kinds…");
  $("#check").disabled = true;
  try {
    const j = await post("api/check", editsBody(lastEdits));
    const bad = j.results.filter(r => !r.ok);
    if (!bad.length) {
      flash(`Everything builds (${j.results.length} block${j.results.length === 1 ? "" : "s"}). rsmm apply will accept them.`, "st-ok", 4000);
    } else {
      // A failure stays until the next edit: it is the thing to fix.
      const box = el("div", { class: "results" });
      for (const r of bad) box.append(el("div", { class: "st-bad", text: "✗ " + r.kind + " " + r.id + ": " + r.error }));
      const st = $("#status"); st.textContent = ""; st.className = "";
      st.append(el("div", { class: "st-bad", text: `${bad.length} of ${j.results.length} block(s) would fail in rsmm apply:` }), box);
    }
  } catch (e) { status(e.message, "st-bad"); }
  $("#check").disabled = false;
};

function renderMods() {
  const sel = $("#mod"); sel.textContent = "";
  sel.append(el("option", { value: "__new__", text: "New mod…" }));
  for (const m of S.mods) sel.append(el("option", { value: m.id, text: m.name === m.id ? m.id : `${m.name} (${m.id})` }));
  sel.onchange = () => {
    $("#open").disabled = sel.value === "__new__";
    $("#save").textContent = sel.value === "__new__" ? "Create mod…"
      : S.loaded && sel.value === S.loaded.id ? "Save to mod" : "Add to mod";
  };
  sel.onchange();
}

// The details of a new mod, asked when it is created. The author is kept for
// next time (a per-viewer convenience; the page works the same without it).
const AUTHOR_KEY = "rsmm.editor.author";
// `error` reopens the form after a refusal, answers kept, with the reason.
function askNewMod(error) {
  const dlg = $("#newmoddlg"), tags = $("#nm-tags");
  if (!tags.childElementCount) {
    for (const t of S.modTags) tags.append(el("label", {}, el("input", { type: "checkbox", value: t }), t));
  }
  if (!$("#nm-author").value) $("#nm-author").value = store.get(AUTHOR_KEY) || "";
  $("#nm-error").textContent = error || "";
  return new Promise(resolve => {
    dlg.onclose = () => {
      if (dlg.returnValue !== "ok") { resolve(null); return; }
      const picked = [...tags.querySelectorAll("input:checked")].map(i => i.value);
      const more = $("#nm-moretags").value.split(",").map(t => t.trim()).filter(Boolean);
      resolve({ id: $("#nm-id").value.trim(), meta: {
        name: $("#nm-name").value, author: $("#nm-author").value, version: $("#nm-version").value,
        summary: $("#nm-summary").value, description: $("#nm-desc").value, tags: [...picked, ...more],
        license: $("#nm-license").value, homepage_url: $("#nm-home").value, repo_url: $("#nm-repo").value } });
    };
    dlg.returnValue = "";
    dlg.showModal();
    $("#nm-id").focus();
  });
}
$("#save").onclick = () => saveAll();
async function saveAll(error) {
  const create = $("#mod").value === "__new__";
  let mod = $("#mod").value, meta = null;
  if (create) {
    const got = await askNewMod(error);
    if (!got) return;
    ({ id: mod, meta } = got);
    if (meta.author.trim()) store.set(AUTHOR_KEY, meta.author.trim());
  }
  // Saving to the opened mod sends only what changed since it was opened, in
  // place of the blocks it came from; any other mod gets everything.
  const intoOpened = !create && S.loaded && mod === S.loaded.id;
  const edits = intoOpened ? lastEdits.filter(editIsNew) : lastEdits;
  const replace = intoOpened ? edits.flatMap(e => (loadedEntry(e.tab, e.id) || {}).blocks || []) : [];
  const wantScript = intoOpened ? scriptChanged() : scriptNorm(S.script) !== NO_GRANTS;
  const script = wantScript ? JSON.parse(scriptNorm(S.script)) : null;
  if (!edits.length && !script) { flash("Nothing changed since you opened it.", "muted", 4000); return; }
  try {
    const j = await post("api/save", Object.assign(editsBody(edits), { mod, create, replace },
      meta ? { meta } : {}, script ? { script } : {}));
    if (create) { S.mods = (await get("api/mods")).mods; renderMods(); }
    // Keep working: the mod as saved opens back in, so the next change and save
    // go to the same blocks.
    await openMod(mod, { ask: false, quiet: true });
    const what = [j.blocks ? `${j.blocks} block(s)` : "", script ? "the test grants" : ""].filter(Boolean).join(" and ");
    flash(window.RSMM_HOSTED
      ? `Saved ${what} to ${mod} and downloaded ${mod}.zip. Unzip it into your mods folder, then run: rsmm apply`
      : `Saved ${what} to ${j.saved}. Keep editing, or run: rsmm apply`, "st-ok", 9000);
  } catch (e) {
    // A refused new mod (a taken id, a bad version) asks again, with the reason.
    if (create) saveAll(e.message); else status(e.message, "st-bad");
  }
}

// ---- boot --------------------------------------------------------------------------
(async () => {
  try {
    const [it, ic, st, he, mo] = await Promise.all([get("api/items"), get("api/icons"), get("api/stats"), get("api/heroes"), get("api/mods")]);
    S.items = it.items; S.icons = ic.icons; S.stats = st.stats; S.heroes = he.heroes; S.mods = mo.mods;
    S.modTags = mo.tags || [];
    get("api/heroes/portraits").then(j => { S.portraits = j.portraits || {}; if (S.tab === "talents") renderList(); }).catch(() => {});
  } catch (e) { status("Could not read the game data: " + e.message, "st-bad"); }
  syncFromStore();
  for (const r of [...new Set(S.items.map(i => i.rarity))]) $("#rarity").append(el("option", { value: r, text: r }));
  renderMods();
  // The mod opened last time is still open, if it is still there.
  if (S.loaded && S.mods.some(m => m.id === S.loaded.id)) { $("#mod").value = S.loaded.id; $("#mod").onchange(); }
  else if (S.loaded) { S.loaded = null; store.del(LOADED_KEY); }
  // A deep link opens a pick: #item=<id> or #hero=<name>.
  const link = new URLSearchParams(location.hash.slice(1));
  if (link.get("hero")) S.tab = "talents";
  if (link.get("item")) S.tab = "items";
  setTab(S.tab);
  if (link.get("item")) pickItem(link.get("item"));
  if (link.get("hero")) pickHero(link.get("hero"));
})();
</script>
</body>
