<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ravenswatch Map Editor</title>
<style>{{common.css}}</style>
<style>
/* The chapter editor: the map is the work surface, everything else floats on it.
   Colours are the shared editor palette (common.css), so this tab looks like the
   others: --gilt marks what you have hold of (selection, active tool), --ok a
   tile pinned by hand, the accent is Save. */
:root {
  --chrome: var(--panel); --chrome2: var(--bg); --rule: var(--line); --text: var(--ink); --dim: var(--muted);
  --lantern: var(--gilt); --lanternbg: var(--accentbg); --glass: var(--ok); --glassbg: var(--okbg);
  --gone: var(--bad); --view: var(--bg);
  --g0: #4f86c6; --g1: #3aa39a; --g2: #d9822b; --g3: #b54a8c; --g4: #8a6fd1; --g5: #7c9a2f; --g6: #c9544d; --g7: #2f8fb0;
}
@media (prefers-color-scheme: dark) {
  :root { --g0: #6fa4e0; --g1: #52c2b8; --g2: #f09a45; --g3: #d06aa8; --g4: #a891ea; --g5: #9cbd48; --g6: #e8736b; --g7: #4fb0d2; }
}
html, body { height: 100%; }
body { margin: 0; background: var(--view); color: var(--text); overflow: hidden;
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, select, input { font: inherit; }

/* ---- top bar ---- */
#bar { position: fixed; inset: 0 0 auto 0; height: 52px; z-index: 10; display: flex; align-items: center; gap: 14px;
  padding: 0 14px 0 12px; background: var(--chrome); border-bottom: 1px solid var(--rule); }
#bar h1 { font-size: 15px; font-weight: 650; margin: 0; white-space: nowrap; }
#bar select { background: var(--chrome2); color: var(--text); border: 1px solid var(--rule); border-radius: 6px; padding: 4px 6px; max-width: 220px; }
#bar .grow { flex: 1; }
#status { color: var(--dim); max-width: 46ch; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#status.bad { color: var(--gone); } #status.ok { color: var(--glass); }
.btn { border: 1px solid var(--rule); background: var(--chrome2); color: var(--text); border-radius: 7px; padding: 5px 12px; cursor: pointer; }
.btn:hover { border-color: var(--lantern); }
.btn.save { background: var(--accent); border-color: var(--accent); color: var(--onaccent); font-weight: 600; }
.btn.save:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .5; cursor: default; }
.count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 9px; background: var(--lanternbg); color: var(--lantern); font-size: 11px; text-align: center; }

/* ---- the map ---- */
#viewport { position: fixed; inset: 52px 0 0 0; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
#gl.orbit { cursor: grabbing; }
body[data-tool=select] #gl { cursor: default; }
#nogl { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; color: var(--dim); }
#tip { position: absolute; pointer-events: none; background: var(--chrome); color: var(--text); border: 1px solid var(--rule);
  border-radius: 6px; padding: 4px 8px; font-size: 12px; white-space: nowrap; z-index: 6; }
#load { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 5; font-size: 12px;
  background: var(--chrome); border: 1px solid var(--rule); border-radius: 12px; padding: 3px 12px; }
#hint { position: absolute; left: 76px; bottom: 12px; z-index: 5; font-size: 12px; color: var(--dim);
  background: color-mix(in srgb, var(--chrome) 88%, transparent); padding: 4px 10px; border-radius: 6px; max-width: calc(100% - 480px); }

/* ---- tool rail ---- */
#tools { position: absolute; left: 12px; top: 12px; z-index: 5; display: flex; flex-direction: column; gap: 4px; padding: 5px;
  background: var(--chrome); border: 1px solid var(--rule); border-radius: 10px; }
#tools button { position: relative; width: 42px; height: 42px; border: 0; border-radius: 7px; background: none; color: var(--text); cursor: pointer; display: grid; place-items: center; }
#tools button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
#tools button:hover { background: var(--chrome2); }
#tools button[aria-pressed=true] { background: var(--lanternbg); color: var(--lantern); }
#tools button kbd { position: absolute; right: 3px; bottom: 1px; font: 9px/1 system-ui; color: var(--dim); }
#tools hr { border: 0; border-top: 1px solid var(--rule); margin: 2px 4px; }

/* ---- inspector ---- */
#insp { position: absolute; right: 12px; top: 12px; bottom: 12px; width: 352px; z-index: 5; display: flex; flex-direction: column;
  background: var(--chrome); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
#insp > header { padding: 14px 16px 10px; border-bottom: 1px solid var(--rule); }
#insp > header h2 { font-size: 15px; font-weight: 650; margin: 0; }
#insp > header p { margin: 3px 0 0; color: var(--dim); }
#insp .scroll { overflow: auto; padding: 4px 16px 16px; flex: 1; }
#insp h3 { font-size: 12px; font-weight: 600; color: var(--dim); margin: 16px 0 6px; }
#insp details { border-bottom: 1px solid var(--rule); padding: 2px 0 8px; }
#insp details:last-child { border-bottom: 0; }
#insp summary { cursor: pointer; font-weight: 600; padding: 10px 0 4px; list-style: none; display: flex; justify-content: space-between; }
#insp summary::-webkit-details-marker { display: none; }
#insp summary::after { content: "+"; color: var(--dim); }
#insp details[open] > summary::after { content: "–"; }
.rows { display: grid; grid-template-columns: 1fr 64px 64px; gap: 4px 8px; align-items: center; }
.rows .h { color: var(--dim); font-size: 11px; }
.rows .name { cursor: pointer; border-radius: 5px; padding: 2px 4px; margin-left: -4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rows .name:hover { background: var(--chrome2); }
.rows .name.on { background: var(--lanternbg); color: var(--lantern); }
.rows input, .field input, .field select { width: 100%; background: var(--chrome2); color: var(--text); border: 1px solid var(--rule); border-radius: 5px; padding: 3px 6px; }
.rows input.changed, .chk.changed { box-shadow: inset 3px 0 0 var(--lantern); }
.field { display: grid; grid-template-columns: 96px 1fr; gap: 6px 10px; align-items: center; margin: 6px 0; }
.field label { color: var(--dim); }
.chk { display: flex; gap: 7px; align-items: center; padding: 2px 4px; border-radius: 5px; }
.chk input { accent-color: var(--lantern); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: var(--chrome2); color: var(--text); padding: 4px 10px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed=true] { background: var(--lanternbg); color: var(--lantern); font-weight: 600; }
input[type=range] { width: 100%; accent-color: var(--lantern); }
.tilelist { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.tile { text-align: left; border: 1px solid transparent; background: none; color: var(--text); border-radius: 6px; padding: 5px 7px; cursor: pointer; }
.tile:hover { background: var(--chrome2); }
.tile[aria-pressed=true] { border-color: var(--glass); background: var(--glassbg); }
.tile small { display: block; color: var(--dim); }
.pin { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--glassbg); border: 1px solid var(--glass); margin: 6px 0; }
.pin b { flex: 1; }
.warnline { color: var(--gone); margin: 6px 0; }
.muted { color: var(--dim); }
.danger { color: var(--gone); }
.linkbtn { border: 0; background: none; color: var(--lantern); cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px; }

/* ---- dialogs ---- */
dialog { border: 1px solid var(--rule); border-radius: 12px; background: var(--chrome); color: var(--text); padding: 0; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 64px); }
dialog::backdrop { background: #0007; }
dialog header { padding: 16px 20px 8px; } dialog header h2 { font-size: 16px; font-weight: 650; margin: 0; }
dialog .body { padding: 4px 20px 8px; overflow: auto; max-height: calc(100vh - 220px); }
dialog footer { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 20px 16px; border-top: 1px solid var(--rule); }
ul.changes { list-style: none; margin: 4px 0 12px; padding: 0; }
ul.changes li { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--rule); }
ul.changes button { border: 0; background: none; color: var(--lantern); cursor: pointer; }
fieldset { border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px; margin: 8px 0; display: grid; gap: 6px; }
legend { color: var(--dim); padding: 0 4px; }
pre.cmd { background: var(--chrome2); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; }
:focus-visible { outline: 2px solid var(--lantern); outline-offset: 1px; }

@media (max-width: 900px) {
  #insp { top: auto; height: 46%; left: 12px; right: 12px; width: auto; }
  #hint { display: none; }
  #bar h1 { display: none; }
}
html.embedded #bar h1 { display: none; }
@media (prefers-reduced-motion: no-preference) { .tile, .btn, #tools button { transition: background .12s, border-color .12s; } }
</style>
</head>
<body data-tool="select">
<div id="bar">
  <h1 id="title">Chapter editor</h1>
  <select id="chapter" aria-label="Chapter"></select>
  <select id="scenario" aria-label="Scenario" title="The game picks one scenario per run; some spots allow different tiles per scenario"></select>
  <select id="openmod" aria-label="Open a saved mod"><option value="">Open a saved mod…</option></select>
  <span class="grow"></span>
  <span id="status" role="status" aria-live="polite">Loading…</span>
  <button class="btn" id="sample" title="Fill the spots roughly the way a run would (press again for another roll)">Preview a run</button>
  <button class="btn save" id="saveopen">Save<span class="count" id="nchanges" hidden></span></button>
</div>
<div id="viewport">
  <canvas id="gl" aria-label="3D view of the chapter: terrain, spots and tiles"></canvas>
  <div id="nogl" hidden>This editor draws the chapter in 3D and needs WebGL2, which this browser does not offer.</div>
  <nav id="tools" aria-label="Tools">
    <button data-tool="select" title="Select (1)" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-3 6z"/></svg><kbd>1</kbd></button>
    <button data-tool="move" title="Move a spot (2)" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg><kbd>2</kbd></button>
    <button data-tool="add" title="Add a spot (3)" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 8v8M8 12h8"/></svg><kbd>3</kbd></button>
    <button data-tool="place" title="Place a tile by hand (4)" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 21s-6-5.5-6-11a6 6 0 0112 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg><kbd>4</kbd></button>
    <button data-tool="paint" title="Paint the terrain (5)" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 19c3-1 4-4 7-4s3 3 6 3 4-2 5-3"/><path d="M3 14c3-2 5-7 9-7s5 4 9 2"/></svg><kbd>5</kbd></button>
    <hr>
    <button id="recenter" title="Reset the camera (0)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    <button id="undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
  </nav>
  <aside id="insp" aria-label="Inspector"><header><h2 id="ih">Chapter</h2><p id="ip"></p></header><div class="scroll" id="ib"></div></aside>
  <div id="hint"></div>
  <div id="load" hidden></div>
  <div id="tip" hidden></div>
</div>

<dialog id="savedlg" aria-labelledby="savetitle">
  <header><h2 id="savetitle">Save as a mod</h2></header>
  <div class="body" id="savebody"></div>
  <footer><button class="btn" id="saveclose">Close</button><button class="btn" id="check">Check</button><button class="btn save" id="save">Save mod</button></footer>
</dialog>
<dialog id="pooldlg" aria-labelledby="pooltitle">
  <header><h2 id="pooltitle">Tile pool</h2></header>
  <div class="body" id="poolbody"></div>
  <footer><button class="btn" id="poolclose">Done</button></footer>
</dialog>

<script>{{common.js}}</script>
<script type="module">
// three.js is served by the editor itself (vendored, MIT; see editor/static).
let THREE = null;
try { THREE = await import("./static/three.module.min.js"); } catch (err) { console.error(err); }
const $ = (id) => document.getElementById(id);
const S = {
  chapters: [], chapter: null, orig: null, work: null, scen: 0, terrain: null, terrainBase: null,
  tool: "select", slot: null, kind: null, models: true, layout: {}, layoutSample: false, pool: [], catalog: null,
  seed: 1, sceneInfo: null, modelsError: null,
  // Changes that only a map CLONE can carry (see Save): the tile pool, tiles
  // pinned by hand, painted terrain. Spots can be moved, added and removed either way.
  poolEdit: { add: [], remove: [] }, place: {}, strokes: [], removed: new Set(), nextNew: 0,
  addSize: null, placeTile: null,
  brush: { mode: "shape", op: "raise", radius: 24, amount: 3, falloff: "smooth", layer: null, surfOp: "raise", strength: 0.5, color: "#b89a6a" },
  layers: {}, layerList: null, overlay: null, showOverlay: true,
  saveAs: "chapter", mapId: "", mapPlay: true, lastSave: null, savedKey: null, poolFilter: "", placeFilter: "",
};
const history = [];
const GROUP_COLORS = ["--g0", "--g1", "--g2", "--g3", "--g4", "--g5", "--g6", "--g7"];
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
function status(msg, cls) { const el = $("status"); el.textContent = msg; el.title = msg; el.className = cls || ""; }
const clone = (o) => JSON.parse(JSON.stringify(o));
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nice = (n) => String(n).replace(/_/g, " ");
const sizeLabel = (g) => String(g).replace("x", "×") + " m";
const sameList = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
const tileShort = (p) => nice(p.split("\\").pop().replace(".tiledef.ot", ""));
const isNew = (s) => typeof s.id === "string";
const liveSlots = () => S.work.slots.filter(s => !s.whole_map && !S.removed.has(s.id));
const slotById = (id) => S.work.slots.find(s => s.id === id);
const origSlot = (id) => S.orig.slots.find(s => s.id === id);

// ---- undo: one snapshot of everything editable per action -------------------
function snap() {
  return JSON.stringify({ work: S.work, poolEdit: S.poolEdit, place: S.place, strokes: S.strokes,
    removed: [...S.removed], nextNew: S.nextNew });
}
function remember() { history.push(snap()); if (history.length > 200) history.shift(); }
function undo() {
  const h = history.pop(); if (!h) { status("Nothing to undo"); return; }
  const o = JSON.parse(h), terrainChanged = o.strokes.length !== S.strokes.length;
  Object.assign(S, { work: o.work, poolEdit: o.poolEdit, place: o.place, strokes: o.strokes,
    removed: new Set(o.removed), nextNew: o.nextNew });
  if (terrainChanged) repaint();
  drawLayout(); render(); status("Undone");
}

// ---- the edit document: the diff between the shipped chapter and the work --
function edits() {
  const e = { kinds: {}, quotas: {}, slots: {}, fill: {}, remove_slots: {}, add_slots: [] };
  S.work.kinds.forEach((k, i) => {
    const o = S.orig.kinds[i], d = {};
    if (k.count !== o.count) d.count = k.count;
    if (Math.abs(k.min_distance - o.min_distance) > 1e-4) d.min_distance = k.min_distance;
    const fp = {};
    for (const g in k.footprints) if (k.footprints[g] !== o.footprints[g]) fp[g] = k.footprints[g];
    if (Object.keys(fp).length) d.footprints = fp;
    if (Object.keys(d).length) e.kinds[k.name] = d;
  });
  S.work.quotas.forEach((q, i) => { if (q.limit !== S.orig.quotas[i].limit) e.quotas[q.key] = q.limit; });
  for (const s of S.work.slots) {
    if (isNew(s)) continue;
    if (S.removed.has(s.id)) { e.remove_slots[String(s.id)] = origSlot(s.id).pos; continue; }
    const o = origSlot(s.id), d = {}, allow = {};
    for (const k in s.allow) if (s.allow[k] !== o.allow[k]) allow[k] = s.allow[k];
    if (Object.keys(allow).length) d.allow = allow;
    if (s.pos[0] !== o.pos[0] || s.pos[2] !== o.pos[2]) d.move = s.pos;
    if (Object.keys(d).length) e.slots[String(s.id)] = { pos: o.pos, ...d };
  }
  for (const s of S.work.slots.filter(isNew)) {
    const allow = Object.fromEntries(Object.entries(s.allow).filter(([, v]) => v));
    e.add_slots.push({ group: s.group, pos: s.pos, ...(Object.keys(allow).length ? { allow } : {}) });
  }
  S.work.groups.forEach((g, i) => { if (!sameList(g.fill, S.orig.groups[i].fill)) e.fill[g.name] = g.fill; });
  for (const k of Object.keys(e)) if (Array.isArray(e[k]) ? !e[k].length : !Object.keys(e[k]).length) delete e[k];
  return e;
}
// Hand placements keyed the way the map kind reads them: a shipped id, or newN.
function placeDoc() {
  const added = S.work.slots.filter(isNew).map(s => s.id), out = {};
  for (const [id, path] of Object.entries(S.place)) {
    const key = id.startsWith("n") ? "new" + added.indexOf(id) : id;
    const [, biome, file] = path.split("\\");
    out[key] = `${biome}/${file.replace(".tiledef.ot", "")}`;
  }
  return out;
}
const poolChanged = () => S.poolEdit.add.length + S.poolEdit.remove.length > 0;
const cloneOnly = () => poolChanged() || Object.keys(S.place).length > 0 || S.strokes.length > 0;
const asMap = () => S.saveAs === "map" || cloneOnly();

function changeList() {
  const out = [], e = edits();
  S.work.kinds.forEach((k, i) => {
    const o = S.orig.kinds[i];
    if (k.count !== o.count) out.push({ text: `${nice(k.name)}: ${o.count} → ${k.count} per run`, undo: () => { k.count = o.count; } });
    if (Math.abs(k.min_distance - o.min_distance) > 1e-4) out.push({ text: `${nice(k.name)}: spacing ${o.min_distance} → ${k.min_distance} m`, undo: () => { k.min_distance = o.min_distance; } });
    for (const g in k.footprints) if (k.footprints[g] !== o.footprints[g])
      out.push({ text: `${nice(k.name)} ${k.footprints[g] ? "now fits" : "no longer fits"} ${sizeLabel(g)} spots`, undo: () => { k.footprints[g] = o.footprints[g]; } });
  });
  S.work.quotas.forEach((q, i) => { const o = S.orig.quotas[i];
    if (q.limit !== o.limit) out.push({ text: `At most ${q.limit} ${nice(q.flags.join(" + "))} (was ${o.limit})`, undo: () => { q.limit = o.limit; } }); });
  S.work.groups.forEach((g, i) => { const o = S.orig.groups[i];
    if (!sameList(g.fill, o.fill)) out.push({ text: `Leftover ${sizeLabel(g.name)} spots ${g.fill.length ? "filled" : "stay empty"}`, undo: () => { g.fill = o.fill.slice(); } }); });
  for (const [id, se] of Object.entries(e.slots || {})) {
    const s = slotById(Number(id)), o = origSlot(Number(id));
    if (se.move) out.push({ text: `Spot ${id} moved`, undo: () => { s.pos = o.pos.slice(); } });
    for (const k in se.allow || {}) out.push({ text: `Spot ${id}: ${nice(k)} ${se.allow[k] ? "allowed" : "not allowed"}`, undo: () => { s.allow[k] = o.allow[k]; } });
  }
  for (const id of S.removed) out.push({ text: `Spot ${id} removed`, undo: () => { S.removed.delete(id); } });
  for (const s of S.work.slots.filter(isNew)) out.push({ text: `New ${sizeLabel(s.group)} spot`, undo: () => { dropNew(s.id); } });
  for (const [id, p] of Object.entries(S.place)) out.push({ text: `${tileShort(p)} pinned to spot ${id.startsWith("n") ? "(new)" : id}`, undo: () => { delete S.place[id]; } });
  if (S.strokes.length) out.push({ text: `Terrain painted (${S.strokes.length} brush stroke${S.strokes.length === 1 ? "" : "s"})`, undo: () => { S.strokes = []; repaint(); } });
  for (const p of S.poolEdit.add) out.push({ text: `Pool: add ${tileShort(p)}`, undo: () => { S.poolEdit.add = S.poolEdit.add.filter(x => x !== p); } });
  for (const p of S.poolEdit.remove) out.push({ text: `Pool: remove ${tileShort(p)}`, undo: () => { S.poolEdit.remove = S.poolEdit.remove.filter(x => x !== p); } });
  return out;
}
function dropNew(id) {
  S.work.slots = S.work.slots.filter(s => s.id !== id);
  for (const g of S.work.groups) g.slots = g.slots.filter(x => x !== id);
  delete S.place[id];
  if (S.slot === id) S.slot = null;
}

// ---- eligibility ------------------------------------------------------------
// Per scenario the compatibility table may override a spot's mask: 1 forces
// the tile type on, 0 keeps it off, anything else defers to the mask.
function allowedHere(slot, kind) {
  const ov = ((slot.overrides || [])[S.scen] || {})[kind.name];
  if (ov === 1) return true;
  if (ov === 0) return false;
  return !!slot.allow[kind.name];
}
function eligible(slot, kind) {
  if (slot.whole_map || !allowedHere(slot, kind)) return "no";
  return kind.footprints[slot.group] ? "yes" : "blocked";
}
const fitsNow = (s) => S.work.kinds.filter(k => eligible(s, k) === "yes");
function poolNow() {
  const gone = new Set(S.poolEdit.remove);
  const added = S.poolEdit.add.map(p => (S.catalog || []).find(t => t.path === p)).filter(Boolean);
  return S.pool.filter(t => !gone.has(t.path)).concat(added);
}
function bareKinds() {
  const pool = poolNow();

  document.querySelectorAll("#tools [data-tool]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tool === t)));
  if (t === "place") loadCatalog();
  if (t !== "paint") setOverlay(null);
  else if (S.brush.mode === "surface") setOverlay(S.brush.layer);
  drawCursor(null); render();
}
function inspector(h2, p, body) {
  $("ih").textContent = h2; $("ip").textContent = p || ""; $("ip").hidden = !p; $("ib").innerHTML = body;
}
function render() {
  if (!S.work) return;

  $("nchanges").textContent = String(n); $("nchanges").hidden = !n;
  $("hint").textContent = HINTS[S.tool];

function renderSpot(s) {

    <p class="muted">This tile lands here in every run; nothing else can.</p>`;
  else {
    const fits = poolNow().filter(t => `${t.width}x${t.height}` === s.group);
    h += `<div class="field"><label for="pinsel">Tile</label><select id="pinsel"><option value="">Chosen by the generator</option>${fits.map(t => `<option value="${esc(t.path)}">${esc(nice(t.name))}</option>`).join("")}</select></div>`;
  }
  h += `<h3>Allowed here</h3>`;
  const now = [], off = [];
  S.work.kinds.forEach(k => (k.footprints[s.group] ? now : off).push(k));

    const ch = o && s.allow[k.name] !== o.allow[k.name];
    const note = ov[k.name] === 1 ? ` <span class="muted">(forced on in this scenario)</span>` : ov[k.name] === 0 ? ` <span class="muted">(kept off in this scenario)</span>` : "";

// Show one surface layer on the ground in gold (or none), recolouring the mesh.

// ---- the tile pool -------------------------------------------------------------
function loadCatalog() {
  if (S.catalog !== null) return;
  S.catalog = [];

    .catch(err => status(`Tile list: ${err.message}`, "bad"));
}
function openPool() { loadCatalog(); renderPool(); $("pooldlg").showModal(); }
function renderPool() {
  const gone = new Set(S.poolEdit.remove), q = S.poolFilter.toLowerCase();
  const match = (t) => !q || `${nice(t.name)} ${t.flags.join(" ")} ${t.biome}`.toLowerCase().includes(q);
  const row = (t, on, attr) => `<label class="chk"><input type="checkbox" ${attr}="${esc(t.path)}" ${on ? "checked" : ""}> <span>${esc(nice(t.name))} <span class="muted">${esc(sizeLabel(t.width + "x" + t.height))}, ${esc(nice(t.flags.join(", ")))}</span></span></label>`;
  const inPool = new Set(S.pool.map(t => t.path)), others = (S.catalog || []).filter(t => !inPool.has(t.path) && match(t));

    <div class="field"><label for="poolfind">Find</label><input id="poolfind" type="search" placeholder="Name, flag or map" value="${esc(S.poolFilter)}"></div>`;
  const bare = bareKinds();

    const r = await api("api/check", saveBody({}));

async function doSave() {
  const id = (S.modId || "").trim().toLowerCase();
  if (!id) { status("Give the mod an id first (letters, digits, - or _)", "bad"); $("modid").focus(); return; }
  if (asMap() && !S.mapId) { status("Give the new map an id first (a letter, then letters, digits or _)", "bad"); $("mapid").focus(); return; }
  status("Saving…");
  try {
    const r = await api("api/save", saveBody({ mod_id: id, name: (S.modName || "").trim() }));
    S.lastSave = r; S.savedKey = changeKey(); status(`Saved ${r.path}`, "ok");

      $("openmod").insertAdjacentHTML("beforeend", `<option value="${esc(id)}">${esc(id)}</option>`);

// ---- loading ---------------------------------------------------------------------
async function loadTerrain(key) {
  try {
    const t = decodeTerrain(await api("api/terrain?grid=512&chapter=" + encodeURIComponent(key)));
    if (S.chapter.key !== key) return;
    S.terrain = t; S.terrainBase = t.h.slice(); G.terrainKey = null;
    const painted = [...new Set(S.strokes.map(st => st.layer).filter(Boolean))];
    await Promise.all(painted.map(n => ensureLayer(n).catch(() => null)));
    if (S.strokes.length) for (const st of S.strokes) brush(S.terrain, st);
    resetCamera(); drawLayout(); render();
  } catch (err) {
    S.terrain = null; S.terrainBase = null;
    status(`No terrain for ${key} (${err.message}); spots are still editable`, "bad"); render();
  }
}
async function loadChapter(key, opened) {
  status("Loading " + key + "…");
  const data = await api("api/recipe?chapter=" + encodeURIComponent(key));
  S.chapter = data.chapter; S.orig = data.recipe; S.work = clone(data.recipe);
  Object.assign(S, { kind: null, slot: null, scen: 0, terrain: null, terrainBase: null, lastSave: null, layout: {}, layoutSample: false,
    layers: {}, layerList: null, overlay: null,
    pool: [], sceneInfo: null, modelsError: null, poolEdit: { add: [], remove: [] }, place: {}, strokes: [], removed: new Set(), nextNew: 0,
    addSize: null, saveAs: "chapter", mapId: "", mapPlay: true });
  history.length = 0; G.terrainKey = null; G.tileCache.clear();
  if (G.three) { clearGroup(G.three.groups.tiles); G.three.groups.tiles.userData.token = null; }
  $("scenario").innerHTML = S.orig.scenarios.map((sc, i) => `<option value="${i}">${esc(sc.label || sc.id)}</option>`).join("");
  $("scenario").hidden = S.orig.scenarios.length < 2;
  if (opened) applyOpened(opened);
  $("chapter").value = key; $("title").textContent = data.chapter.label;
  render();
  status("Ready. Pick a tool on the left, or click a spot");
  loadTerrain(key);
  api("api/tiles?chapter=" + encodeURIComponent(key)).then(r => { if (S.chapter.key === key) { S.pool = r.tiles; drawLayout(); render(); } }).catch(() => {});
  if (G.three && S.models) loadScenery(key);
}
// Rebuild the working state from a saved mod's edit document.
function applyOpened(m) {
  const e = m.edits || {};
  for (const [n, d] of Object.entries(e.kinds || {})) {
    const k = S.work.kinds.find(x => x.name === n); if (!k) continue;
    if ("count" in d) k.count = d.count;
    if ("min_distance" in d) k.min_distance = d.min_distance;
    Object.assign(k.footprints, d.footprints || {});
  }
  for (const [q, v] of Object.entries(e.quotas || {})) { const x = S.work.quotas.find(y => y.key === q); if (x) x.limit = v; }
  for (const [id, d] of Object.entries(e.slots || {})) {
    const s = slotById(Number(id)); if (!s) continue;
    Object.assign(s.allow, d.allow || {}); if (d.move) s.pos = d.move.slice();
  }
  for (const id of Object.keys(e.remove_slots || {})) S.removed.add(Number(id));
  for (const a of e.add_slots || []) {
    const id = "n" + (S.nextNew++);
    S.work.slots.push({ id, pos: a.pos.slice(), group: a.group, whole_map: false,
      allow: Object.fromEntries(S.work.kinds.map(k => [k.name, !!(a.allow || {})[k.name]])), overrides: [] });
    const g = S.work.groups.find(x => x.name === a.group); if (g) g.slots.push(id);
  }
  for (const [n, flags] of Object.entries(e.fill || {})) { const g = S.work.groups.find(x => x.name === n); if (g) g.fill = flags.slice(); }
  if (m.map) {
    S.saveAs = "map"; S.mapId = m.map.id; S.mapPlay = m.map.play; S.poolEdit = clone(m.map.pool);
    S.strokes = clone(m.map.terrain || []);
    for (const [key, path] of Object.entries(m.map.place || {})) S.place[key.startsWith("new") ? "n" + key.slice(3) : key] = path;
    if (S.poolEdit.add.length || Object.keys(S.place).length) loadCatalog();
  }
}

// ---- wiring ----------------------------------------------------------------------
async function init() {
  let gl = false;
  try { gl = glInit(); } catch (err) { console.error(err); }
  if (!gl) { $("nogl").hidden = false; $("gl").hidden = true; }
  const st = await api("api/state");
  S.chapters = st.chapters;
  $("chapter").innerHTML = st.chapters.map(c => `<option value="${esc(c.key)}">${esc(c.label)}</option>`).join("");
  $("openmod").insertAdjacentHTML("beforeend", st.mods.map(m => `<option value="${esc(m.id)}">${esc(m.id)}${m.map ? " (new map)" : ""}</option>`).join(""));
  if (!st.chapters.length) { status("No tile-generated chapters found in the game files", "bad"); return; }
  const hash = new URLSearchParams(location.hash.slice(1));
  const want = st.chapters.find(c => c.key === hash.get("chapter")) || st.chapters.find(c => c.key === store.get("rsmm.mapeditor.chapter")) || st.chapters[0];
  await loadChapter(want.key);
}
$("chapter").addEventListener("change", async e => {
  if (unsavedChanges() && !confirm("Discard unsaved changes?")) { e.target.value = S.chapter.key; return; }
  store.set("rsmm.mapeditor.chapter", e.target.value);
  try { await loadChapter(e.target.value); } catch (err) { status(err.message, "bad"); }
});
$("openmod").addEventListener("change", async e => {
  const id = e.target.value; if (!id) return;
  if (unsavedChanges() && !confirm("Discard unsaved changes?")) { e.target.value = ""; return; }
  try {
    const m = await api("api/mod?id=" + encodeURIComponent(id));
    S.modId = id; S.modName = m.name || "";
    await loadChapter(m.chapter, m);
    S.savedKey = changeKey(); S.lastSave = { path: `mods/${id}/manifest.toml`, next: "rsmm restore --all && rsmm apply" };
    status(`Opened ${id}: ${changeList().length} change(s)`, "ok");
  } catch (err) { status(err.message, "bad"); }
  e.target.value = "";
});
$("scenario").addEventListener("change", e => { S.scen = Number(e.target.value); render(); });
$("recenter").addEventListener("click", resetCamera);
$("undo").addEventListener("click", undo);
$("sample").addEventListener("click", () => {
  if (!S.pool.length) { status("This chapter's tile pool isn't loaded yet", "bad"); return; }
  S.seed = (S.seed * 1103515245 + 12345) >>> 0 || 1;
  S.layout = sampleLayout(S.seed); S.layoutSample = true;
  status(`Preview: ${Object.keys(S.layout).length} tiles rolled, roughly as a run would (approximate)`, "ok");
  drawLayout(); render();
});
document.querySelectorAll("#tools [data-tool]").forEach(b => b.addEventListener("click", () => setTool(b.dataset.tool)));
$("saveopen").addEventListener("click", () => { renderSave(); $("savedlg").showModal(); });
$("saveclose").addEventListener("click", () => $("savedlg").close());
$("poolclose").addEventListener("click", () => $("pooldlg").close());
$("check").addEventListener("click", doCheck);
$("save").addEventListener("click", doSave);
const TOOL_KEYS = { 1: "select", 2: "move", 3: "add", 4: "place", 5: "paint" };
document.addEventListener("keydown", e => {
  if (e.target.closest("input, select, textarea, dialog")) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); return; }
  if (TOOL_KEYS[e.key]) { setTool(TOOL_KEYS[e.key]); return; }
  if (e.key === "0") { resetCamera(); return; }
  if (e.key === "Escape") { S.slot = null; S.kind = null; render(); return; }
  if ((e.key === "Delete" || e.key === "Backspace") && S.slot != null) { $("rmspot")?.click(); }
});
const changeKey = () => JSON.stringify(changeList().map(c => c.text));
function unsavedChanges() {
  if (!S.work) return 0;
  const n = changeList().length;
  return n && S.savedKey !== changeKey() ? n : 0;
}
window.rsmmUnsaved = () => ({ count: unsavedChanges(), kept: false });
window.addEventListener("beforeunload", e => {
  if (window.parent === window && unsavedChanges()) { e.preventDefault(); e.returnValue = ""; }
});
Object.assign(window, { rsmmEditor: { S, G, project, pickAt, groundAt, edits, placeDoc, setTool, toolClick } });
init().catch(err => status(err.message, "bad"));
</script>
